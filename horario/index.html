<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>课程表</title>
  <link rel="icon" type="image/png" href="logo.png" />
<style>
  :root {
    --brand-blue: #0069df;
    --tab-blue: #0069df;
    --card-shadow: 0 4px 12px rgba(0,0,0,.08);
    --ongoing-bg: #e8f0fe;   /* 正在上课：浅蓝背景 */
    --ongoing-text: #0069df; /* 正在上课：蓝色文字 */
    --upcoming-bg: #f1f8e9;  /* 即将开始：浅绿背景 */
    --upcoming-text: #2e7d32;/* 即将开始：深绿文字 */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    background: #f2f5f7;
    color: #222;
  }

  /* 顶部栏（居中） */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--brand-blue);
    color: #fff;
    padding: 14px 16px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    display: flex;
    flex-direction: column;
    align-items: center;      /* 横向居中 */
    text-align: center;       /* 文本居中 */
  }
  .appbar h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  .subline {
    font-size: 12px; opacity: .95; margin-top: 6px;
    display: flex; align-items: center; gap: 8px; justify-content: center; /* 居中 */
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #a8d0ff; display: inline-block; }

  /* 标签栏 */
  .tabs {
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: #fff; border-bottom: 1px solid #e5e9ef;
  }
  .tab {
    text-align: center; padding: 10px 6px; font-size: 15px;
    color: #5f6b7a; border-bottom: 3px solid transparent; cursor: pointer; user-select: none;
  }
  .tab small { display: block; font-size: 11px; opacity: .7; }
  .tab.active { color: var(--tab-blue); border-bottom-color: var(--tab-blue); font-weight: 600; background: #f7faff; }

  /* 内容区与卡片 */
  /* 视口容器：允许垂直滚动，隐藏横向溢出，启用触控优化 */
  .page {
    padding: 0;                 /* padding 移到 slide-inner 上 */
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;        /* 默认允许纵向滚动，我们手动处理横向 */
  }

  /* 横向滑动轨道 */
  .slides {
    display: flex;
    width: 100%;
    will-change: transform;
    transition: transform 280ms cubic-bezier(.22,.61,.36,1);
  }

  /* 单页（每页占满视口宽度） */
  .slide {
    flex: 0 0 100%;
  }

  /* 把原来 .page 的内边距挪到这里；同时负责居中排版 */
  .slide-inner {
    padding: 14px 12px 32px;
  }
  @media (min-width: 560px) {
    .slide-inner { max-width: 520px; margin: 0 auto; }
  }

  .card { background: #fff; border-radius: 12px; box-shadow: var(--card-shadow); padding: 14px 14px 12px; margin: 10px 4px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .title { font-size: 16px; font-weight: 700; line-height: 1.2; color: #24292f; }
  .room {
    font-weight: 700;
    color: #8a94a1;
    min-width: 54px;
    text-align: right;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .room:hover { opacity: .78; }
  .room:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ===== Fénix 官方教室位置 / Blueprint 弹窗 ===== */
  .room-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    place-items: center;
    padding: clamp(10px, 2vw, 24px);
    background: rgba(15, 23, 42, .58);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overscroll-behavior: contain;
  }
  .room-modal.open { display: grid; }

  .room-sheet {
    width: min(1120px, 96vw);
    height: min(900px, 94dvh);
    min-height: 0;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: #fff;
    border: 1px solid rgba(15,23,42,.08);
    border-radius: 22px;
    box-shadow: 0 28px 90px rgba(0,0,0,.32);
    overflow: hidden;
    animation: roomSheetIn .18s ease-out;
  }
  @keyframes roomSheetIn {
    from { transform: translateY(12px) scale(.985); opacity: .55; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .room-grabber { display: none; }

  .room-sheet-head {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #edf0f4;
    background: rgba(255,255,255,.96);
  }
  .room-sheet-title {
    margin: 0;
    min-width: 0;
    font-size: clamp(18px, 2.2vw, 23px);
    color: #20262e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-close {
    flex: 0 0 auto;
    border: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #f2f4f7;
    color: #536170;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .room-close:hover { background: #e9edf2; }
  .room-close:active { transform: scale(.96); }

  .room-breadcrumb {
    margin: 0;
    padding: 13px 16px;
    background: #f5f8fc;
    color: #253b59;
    font-size: clamp(13px, 1.5vw, 15px);
    line-height: 1.55;
    font-weight: 700;
    word-break: break-word;
    border-bottom: 1px solid #e8edf3;
  }
  .room-breadcrumb .arrow {
    color: #8a97a8;
    padding: 0 6px;
  }

  .blueprint-card {
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    background: #fff;
    overflow: hidden;
  }

  .blueprint-topline {
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px 8px 16px;
    border-bottom: 1px solid #e8edf3;
    background: #fff;
  }
  .blueprint-heading {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 9px;
  }
  .blueprint-label {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 800;
    color: #344054;
  }
  .blueprint-source {
    min-width: 0;
    font-size: 11px;
    color: #8b96a5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .blueprint-tools {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .blueprint-tool {
    border: 1px solid #dbe2ea;
    min-width: 38px;
    height: 36px;
    padding: 0 10px;
    border-radius: 9px;
    background: #fff;
    color: #344054;
    font: inherit;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .blueprint-tool:hover { background: #f7f9fb; border-color: #cbd5e1; }
  .blueprint-tool:active { transform: scale(.96); }
  .blueprint-tool.icon { padding: 0; font-size: 18px; }
  .blueprint-tool.primary {
    border-color: #b7d4fa;
    background: #eef6ff;
    color: #0069df;
  }

  .blueprint-wrap {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background:
      linear-gradient(45deg, #f8fafc 25%, transparent 25%),
      linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f8fafc 75%),
      linear-gradient(-45deg, transparent 75%, #f8fafc 75%),
      #fff;
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .blueprint-wrap.dragging { cursor: grabbing; }

  .blueprint-img {
    position: absolute;
    left: 50%;
    top: 50%;
    display: block;
    max-width: calc(100% - 28px);
    max-height: calc(100% - 28px);
    width: auto;
    height: auto;
    object-fit: contain;
    background: #fff;
    transform-origin: center center;
    will-change: transform;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }

  .blueprint-loading,
  .blueprint-error {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 28px;
    color: #758293;
    font-size: 13px;
    line-height: 1.65;
    text-align: center;
    background: rgba(255,255,255,.92);
    z-index: 2;
  }
  .blueprint-error { display: none; }
  .blueprint-link {
    display: inline-block;
    margin-top: 10px;
    color: #0069df;
    font-weight: 750;
    text-decoration: none;
  }

  .zoom-badge {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 3;
    padding: 6px 9px;
    border-radius: 8px;
    background: rgba(17,24,39,.72);
    color: #fff;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .room-meta {
    min-height: 44px;
    margin: 0;
    padding: 10px 16px 12px;
    border-top: 1px solid #edf0f4;
    background: #fff;
    color: #7c8795;
    font-size: 12px;
    line-height: 1.55;
  }

  /* 不显示任何弹窗/查看器滚动条，但保留必要的系统滚动能力 */
  .room-sheet,
  .blueprint-wrap {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .room-sheet::-webkit-scrollbar,
  .blueprint-wrap::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
  }

  /* 平板 */
  @media (max-width: 900px) {
    .room-modal { padding: 10px; }
    .room-sheet {
      width: 100%;
      height: min(94dvh, 860px);
      border-radius: 18px;
    }
    .blueprint-source { display: none; }
  }

  /* 手机：占满屏幕，不出现右侧滚动条 */
  @media (max-width: 600px) {
    .room-modal {
      padding: 0;
      place-items: stretch;
      background: #fff;
    }
    .room-sheet {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }
    .room-grabber { display: none; }
    .room-sheet-head {
      min-height: 56px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
    }
    .room-close {
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }
    .room-breadcrumb {
      padding: 10px 12px;
      font-size: 13px;
    }
    .blueprint-topline {
      min-height: 48px;
      padding: 6px 8px 6px 12px;
    }
    .blueprint-label { font-size: 12px; }
    .blueprint-tools { gap: 4px; }
    .blueprint-tool {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 12px;
    }
    .blueprint-tool.icon { padding: 0; font-size: 17px; }
    .blueprint-tool .desktop-label { display: none; }
    .blueprint-img {
      max-width: calc(100% - 16px);
      max-height: calc(100% - 16px);
    }
    .room-meta {
      min-height: 0;
      padding: 8px 12px max(8px, env(safe-area-inset-bottom));
      font-size: 11px;
    }
    .zoom-badge { right: 8px; bottom: 8px; }
  }

  /* 横屏手机 / 矮屏：压缩顶部信息，最大化图纸面积 */
  @media (max-height: 560px) and (orientation: landscape) {
    .room-sheet {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
    }
    .room-sheet-head { min-height: 46px; padding: 5px 10px; }
    .room-breadcrumb { padding: 6px 10px; font-size: 12px; }
    .blueprint-topline { min-height: 42px; padding: 4px 8px 4px 10px; }
    .room-meta { display: none; }
  }

</style>
</head>

  <div class="appbar">
    <h1>课程表</h1>
    <div class="subline">
    </div>
  </div>

  <!-- 标签栏 -->
  <div class="tabs" role="tablist" aria-label="工作日">
    <div class="tab" data-day="mon" role="tab" aria-selected="false">周一<small>Mon</small></div>
    <div class="tab" data-day="tue" role="tab" aria-selected="false">周二<small>Tue</small></div>
    <div class="tab" data-day="wed" role="tab" aria-selected="false">周三<small>Wed</small></div>

  </div>

  <!-- 内容区（横向滑动容器将由 JS 注入） -->
  <div id="page" class="page" role="tabpanel" aria-live="polite"></div>

<!-- Fénix 官方教室位置与 Blueprint -->
<div id="roomModal" class="room-modal" aria-hidden="true">
  <div class="room-sheet" role="dialog" aria-modal="true" aria-labelledby="roomSheetTitle">
    <div class="room-grabber"></div>

    <div class="room-sheet-head">
      <h2 id="roomSheetTitle" class="room-sheet-title">教室位置</h2>
      <button id="roomClose" class="room-close" type="button" aria-label="关闭">×</button>
    </div>

    <div id="roomBreadcrumb" class="room-breadcrumb"></div>

    <div id="blueprintCard" class="blueprint-card">
      <div class="blueprint-topline">
        <div class="blueprint-heading">
          <span class="blueprint-label">官方楼层图示</span>
          <span class="blueprint-source">Fénix · Instituto Superior Técnico</span>
        </div>

        <div class="blueprint-tools" aria-label="图纸查看工具">
          <button id="zoomOutBtn" class="blueprint-tool icon" type="button" aria-label="缩小" title="缩小">−</button>
          <button id="fitBtn" class="blueprint-tool primary" type="button" aria-label="适应窗口" title="适应窗口">
            <span class="desktop-label">适应</span><span aria-hidden="true"> ⤢</span>
          </button>
          <button id="zoomInBtn" class="blueprint-tool icon" type="button" aria-label="放大" title="放大">＋</button>
          <button id="fullscreenBtn" class="blueprint-tool icon" type="button" aria-label="全屏" title="全屏">⛶</button>
          <button id="openOriginalBtn" class="blueprint-tool icon" type="button" aria-label="打开官方原图" title="打开官方原图">↗</button>
        </div>
      </div>

      <div id="blueprintWrap" class="blueprint-wrap" aria-label="可缩放和拖动的 Fénix 官方 Blueprint">
        <div id="blueprintLoading" class="blueprint-loading">正在加载官方 Blueprint…</div>

        <img id="blueprintImg"
             class="blueprint-img"
             alt="Fénix 官方教室 Blueprint"
             draggable="false"
             style="display:none" />

        <div id="blueprintError" class="blueprint-error">
          <div>
            官方图示暂时无法加载。<br>
            <a id="blueprintLink" class="blueprint-link" target="_blank" rel="noopener noreferrer">
              直接打开 Fénix 官方 Blueprint
            </a>
          </div>
        </div>

        <div id="zoomBadge" class="zoom-badge" aria-hidden="true">100%</div>
      </div>
    </div>

    <div class="room-meta">
      鼠标：滚轮缩放、拖动平移、双击放大。触屏：双指缩放、单指拖动。图示来自 Fénix 官方 API。
    </div>
  </div>
</div>

function applyBlueprintTransform() {

  if (!img) return;

  img.style.transform =
    `translate(-50%, -50%) translate3d(${blueprintState.x}px, ${blueprintState.y}px, 0) scale(${blueprintState.scale})`;

  if (badge) badge.textContent = `${Math.round(blueprintState.scale * 100)}%`;
}

function resetBlueprintView() {
  blueprintState.scale = 1;
  blueprintState.x = 0;
  blueprintState.y = 0;
  blueprintState.pointers.clear();
  blueprintState.dragStart = null;
  blueprintState.pinchStart = null;
  applyBlueprintTransform();
}

function zoomBlueprint(factor, clientX = null, clientY = null) {
  const wrap = document.getElementById('blueprintWrap');
  if (!wrap) return;

  const oldScale = blueprintState.scale;
  const newScale = clamp(oldScale * factor, blueprintState.minScale, blueprintState.maxScale);
  if (Math.abs(newScale - oldScale) < 0.0001) return;

  // 以鼠标/触点所在位置为中心缩放
  if (clientX != null && clientY != null) {
    const rect = wrap.getBoundingClientRect();
    const px = clientX - (rect.left + rect.width / 2);
    const py = clientY - (rect.top + rect.height / 2);
    const ratio = newScale / oldScale;

    blueprintState.x = px - (px - blueprintState.x) * ratio;
    blueprintState.y = py - (py - blueprintState.y) * ratio;
  }

  blueprintState.scale = newScale;
  applyBlueprintTransform();
}

function openRoomInfo(roomName) {
  const info = ROOM_INFO[roomName];
  if (!info) return;

  const modal = document.getElementById('roomModal');
  const img = document.getElementById('blueprintImg');
  const loading = document.getElementById('blueprintLoading');
  const error = document.getElementById('blueprintError');
  const link = document.getElementById('blueprintLink');

  blueprintState.url = url;
  resetBlueprintView();

  document.getElementById('roomSheetTitle').textContent = `教室 ${roomName}`;
  document.getElementById('roomBreadcrumb').innerHTML =
    `<span>Campus ${info.campus}</span>` +
    `<span class="arrow">➧</span>` +
    `<span>Building ${info.building}</span>` +
    `<span class="arrow">➧</span>` +
    `<span>Floor ${info.floor}</span>`;

  loading.style.display = 'grid';
  error.style.display = 'none';

    loading.style.display = 'none';

  img.onerror = () => {
    loading.style.display = 'none';
    img.style.display = 'none';
    error.style.display = 'grid';
  };

  modal.setAttribute('aria-hidden', 'false');

function closeRoomInfo() {
  const modal = document.getElementById('roomModal');

  blueprintState.pointers.clear();
  blueprintState.dragStart = null;
  blueprintState.pinchStart = null;

  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');

}

function installBlueprintViewer() {
  const wrap = document.getElementById('blueprintWrap');
  const card = document.getElementById('blueprintCard');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const fitBtn = document.getElementById('fitBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const openOriginalBtn = document.getElementById('openOriginalBtn');

  if (!wrap) return;

  zoomInBtn.addEventListener('click', () => zoomBlueprint(1.25));
  zoomOutBtn.addEventListener('click', () => zoomBlueprint(0.8));
  fitBtn.addEventListener('click', resetBlueprintView);

  openOriginalBtn.addEventListener('click', () => {
    if (blueprintState.url) {
      window.open(blueprintState.url, '_blank', 'noopener,noreferrer');
    }
  });

  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        if (card.requestFullscreen) await card.requestFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
      }
    } catch (_) {
      // 某些浏览器/file:// 场景禁用 Fullscreen API 时，仍可正常缩放查看
    }
  });

  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? '⤫' : '⛶';
    fullscreenBtn.setAttribute('aria-label', document.fullscreenElement ? '退出全屏' : '全屏');
    setTimeout(resetBlueprintView, 80);
  });

  // 桌面滚轮缩放（以指针为中心）
  wrap.addEventListener('wheel', (e) => {
    if (document.getElementById('blueprintImg').style.display === 'none') return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.13 : 0.885;
    zoomBlueprint(factor, e.clientX, e.clientY);
  }, { passive: false });

  // 双击 / 双击触控放大
  wrap.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (blueprintState.scale > 1.8) {
      resetBlueprintView();
    } else {
      zoomBlueprint(2, e.clientX, e.clientY);
    }
  });

  // Pointer Events：鼠标拖动 + 单指拖动 + 双指捏合
  wrap.addEventListener('pointerdown', (e) => {
    if (document.getElementById('blueprintImg').style.display === 'none') return;

    wrap.setPointerCapture?.(e.pointerId);
    blueprintState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    wrap.classList.add('dragging');

    if (blueprintState.pointers.size === 1) {
      blueprintState.dragStart = {
        pointerX: e.clientX,
        pointerY: e.clientY,
        x: blueprintState.x,
        y: blueprintState.y
      };
      blueprintState.pinchStart = null;
    } else if (blueprintState.pointers.size === 2) {
      const pts = [...blueprintState.pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      const rect = wrap.getBoundingClientRect();
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;

      blueprintState.pinchStart = {
        distance: Math.hypot(dx, dy) || 1,
        scale: blueprintState.scale,
        x: blueprintState.x,
        y: blueprintState.y,
        midX,
        midY,
        localMidX: midX - (rect.left + rect.width / 2),
        localMidY: midY - (rect.top + rect.height / 2)
      };
      blueprintState.dragStart = null;
    }
  });

  wrap.addEventListener('pointermove', (e) => {
    if (!blueprintState.pointers.has(e.pointerId)) return;

    blueprintState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (blueprintState.pointers.size === 1 && blueprintState.dragStart) {
      const p = [...blueprintState.pointers.values()][0];
      blueprintState.x =
        blueprintState.dragStart.x + (p.x - blueprintState.dragStart.pointerX);
      blueprintState.y =
        blueprintState.dragStart.y + (p.y - blueprintState.dragStart.pointerY);
      applyBlueprintTransform();
      return;
    }

    if (blueprintState.pointers.size === 2 && blueprintState.pinchStart) {
      const pts = [...blueprintState.pointers.values()];
      const dx = pts[1].x - pts[0].x;
      const dy = pts[1].y - pts[0].y;
      const distance = Math.hypot(dx, dy) || 1;
      const newScale = clamp(
        blueprintState.pinchStart.scale * distance / blueprintState.pinchStart.distance,
        blueprintState.minScale,
        blueprintState.maxScale
      );

      const rect = wrap.getBoundingClientRect();
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;
      const localX = midX - (rect.left + rect.width / 2);
      const localY = midY - (rect.top + rect.height / 2);
      const ratio = newScale / blueprintState.pinchStart.scale;

      blueprintState.x =
        localX - (blueprintState.pinchStart.localMidX - blueprintState.pinchStart.x) * ratio;
      blueprintState.y =
        localY - (blueprintState.pinchStart.localMidY - blueprintState.pinchStart.y) * ratio;
      blueprintState.scale = newScale;
      applyBlueprintTransform();
    }
  });

  function finishPointer(e) {
    blueprintState.pointers.delete(e.pointerId);

    if (blueprintState.pointers.size === 0) {
      blueprintState.dragStart = null;
      blueprintState.pinchStart = null;
      wrap.classList.remove('dragging');
      return;
    }

    // 双指缩放结束后剩下一根手指，平滑切换为单指拖动
    if (blueprintState.pointers.size === 1) {
      const p = [...blueprintState.pointers.values()][0];
      blueprintState.dragStart = {
        pointerX: p.x,
        pointerY: p.y,
        x: blueprintState.x,
        y: blueprintState.y
      };
      blueprintState.pinchStart = null;
    }
  }

  wrap.addEventListener('pointerup', finishPointer);
  wrap.addEventListener('pointercancel', finishPointer);
  wrap.addEventListener('lostpointercapture', (e) => {
    if (blueprintState.pointers.has(e.pointerId)) finishPointer(e);
  });

  // 键盘辅助：+/-/0，方便桌面端和无障碍操作
  window.addEventListener('keydown', (e) => {
    const modal = document.getElementById('roomModal');
    if (!modal.classList.contains('open')) return;

    if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      zoomBlueprint(1.25);
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      zoomBlueprint(0.8);
    } else if (e.key === '0') {
      e.preventDefault();
      resetBlueprintView();
    }
  });

  // 旋转设备 / 改变窗口后重置到适应窗口，避免图纸跑出视野
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const modal = document.getElementById('roomModal');
      if (modal.classList.contains('open')) resetBlueprintView();
    }, 140);
  });
}

/* ======= 统一按葡萄牙里斯本时区判断 ======= */
const TZ = 'Europe/Lisbon';
function nowLisbon() { return new Date(new Date().toLocaleString('en-US', { timeZone: TZ })); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function hmToMinutes(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }

/** getDay -> key & 有序数组（用于滑动索引） */
const DAY_ORDER = ['mon','tue','wed','thu','fri'];
const dayIndex = k => DAY_ORDER.indexOf(k);
const keyByIndex = i => DAY_ORDER[Math.min(DAY_ORDER.length-1, Math.max(0, i))];

function todayKeyLisbon(){
  const d = nowLisbon().getDay(); // 0-6 (Sun-Sat)
  const map = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  return map[d] || 'mon';
}

/** 只对“今天”返回一条需要高亮的项目（正在上课优先，否则下一节） */
function highlightForDay(dayKey){
  const todayKey = todayKeyLisbon();
  if (dayKey !== todayKey) return null;        // 不是今天 -> 不高亮
  const list = schedule[dayKey] || [];
  if (!list.length) return null;

  const now = nowLisbon();
  const nowM = now.getHours()*60 + now.getMinutes();

  // 1) 正在上课（若存在，仅取第一条）
  for (let i=0;i<list.length;i++){
    const s = hmToMinutes(list[i].start), e = hmToMinutes(list[i].end);
    if (nowM >= s && nowM < e) return { index: i, type: 'ongoing' };
  }
  // 2) 下一节课（仅今天）
  let idx = -1, bestDelta = Infinity;
  for (let i=0;i<list.length;i++){
    const s = hmToMinutes(list[i].start);
    if (s > nowM && (s - nowM) < bestDelta) { bestDelta = s - nowM; idx = i; }
  }
  return idx >= 0 ? { index: idx, type: 'upcoming' } : null;
}

/**
 * 获取本周周一到周五的日期
 * @returns {object} e.g. { mon: '11/04', tue: '11/05', ... }
 */
function getWeekDates() {
    const today = new Date();
    const dayOfWeek = today.getDay(); // 0=周日, 1=周一, ..., 6=周六

    // 计算到周一需要减去的天数。如果今天是周日(0)，则视为上周的最后一天，需减去6天。
    const daysToSubtract = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    
    const monday = new Date(today);
    monday.setDate(today.getDate() - daysToSubtract);

    const weekDates = {};
    const dayKeys = ['mon', 'tue', 'wed', 'thu', 'fri'];

    for (let i = 0; i < 5; i++) {
        const currentDate = new Date(monday);
        currentDate.setDate(monday.getDate() + i);

        const month = currentDate.getMonth() + 1; // 月份是从0开始的
        const date = currentDate.getDate();

        // 格式化为 MM/DD
        const formattedDate = `${String(month).padStart(2, '0')}/${String(date).padStart(2, '0')}`;
        weekDates[dayKeys[i]] = formattedDate;
    }
    return weekDates;
}

/**
 * 更新标签栏的日期显示
 */
function updateTabDates() {
    const dates = getWeekDates();
    document.querySelectorAll('.tab').forEach(tab => {
        const dayKey = tab.dataset.day;
        const dateString = dates[dayKey];
        if (dateString) {
            const smallEl = tab.querySelector('small');
            if (smallEl) {
                smallEl.textContent = dateString;
            }
        }
    });
}

/* =============== 滑动容器渲染 =============== */
let activeDayKey = null;          // 当前激活的标签（键）
let activeIndex = 0;              // 当前激活的滑动页（索引）
let slidesEl = null;              // 轨道
let pageEl = null;                // 视口（#page）
let lastTodayKey = null;          // 记录上一次“今天”的键
let lastMinuteSig = '';           // 上次分钟签名（仅用于判断是否需要刷新）

/** 渲染单天到对应 slide */
function renderSlide(dayKey, autoFocus=true){
  const slide = pageEl.querySelector(`.slide[data-day="${dayKey}"]`);
  if (!slide) return;
  const inner = slide.querySelector('.slide-inner');
  inner.innerHTML = '';

  const list = schedule[dayKey] || [];
  if (!list.length) {
    inner.innerHTML = '<div class="empty">这一天没有安排课程~</div>';
    return;
  }

  const mark = highlightForDay(dayKey);
  let scrollTarget = null;

  list.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (mark && mark.index === i) card.classList.add(mark.type);

    const row = document.createElement('div');
    row.className = 'row';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = `${item.title} : ${item.type}`;

    if (mark && mark.index === i && mark.type === 'ongoing') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '正在上课';
      title.appendChild(badge);
      scrollTarget = card;
    } else if (mark && mark.index === i && mark.type === 'upcoming') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = 'transparent';
      badge.style.color = 'var(--upcoming-text)';
      badge.style.border = '1px solid var(--upcoming-text)';
      badge.textContent = '下一节课';
      title.appendChild(badge);
      scrollTarget = card;
    }

    const room = document.createElement('div');
    room.className = 'room';
    room.textContent = item.room;
    room.setAttribute('role', 'button');
    room.setAttribute('tabindex', '0');
    room.setAttribute('title', `查看 ${item.room} 的位置和官方图示`);
    room.setAttribute('aria-label', `查看教室 ${item.room} 的位置和官方图示`);

    room.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      openRoomInfo(item.room);
    });

    room.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        ev.stopPropagation();
        openRoomInfo(item.room);
      }
    });

    row.appendChild(title);
    row.appendChild(room);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = `${item.start} - ${item.end}`;

    card.appendChild(row);
    card.appendChild(time);
    inner.appendChild(card);
  });

  if (autoFocus && scrollTarget) {
    setTimeout(() => scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  }
}

/** 初始构建 5 个 slide */
function buildSlides(){
  pageEl.innerHTML = ''; // 清空旧内容
  slidesEl = document.createElement('div');
  slidesEl.className = 'slides';
  pageEl.appendChild(slidesEl);

  DAY_ORDER.forEach(k => {
    const slide = document.createElement('section');
    slide.className = 'slide';
    slide.dataset.day = k;
    slide.setAttribute('role', 'tabpanel');
    slide.setAttribute('aria-hidden', 'true');

    const inner = document.createElement('div');
    inner.className = 'slide-inner';

    slide.appendChild(inner);
    slidesEl.appendChild(slide);

    renderSlide(k, false);
  });
}

/** 设置激活 tab + 滑动到对应页 */
function activateTab(dayKey, withAnim=true){
  activeDayKey = dayKey;
  activeIndex = dayIndex(dayKey);

  document.querySelectorAll('.tab').forEach(el => {
    const on = el.dataset.day === dayKey;
    el.classList.toggle('active', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
  });

  // 更新 aria-hidden
  pageEl.querySelectorAll('.slide').forEach((el, i) => {
    el.setAttribute('aria-hidden', i === activeIndex ? 'false' : 'true');
  });

  // 平移动画（百分比，避免计算像素）
  if (!withAnim) slidesEl.style.transition = 'none';
  else slidesEl.style.transition = ''; // 使用 CSS 默认过渡

  slidesEl.style.transform = `translateX(${-activeIndex * 100}%)`;

  // 激活页重新算高亮，不滚动
  renderSlide(dayKey, false);
}

/* =============== 手势交互（安卓式滑动） =============== */
function installSwipe(){
  // 移动端：touch 事件；桌面端：mouse 事件
  let startX = 0, startY = 0, startT = 0;
  let dragging = false;
  let dx = 0;

  const thresholdRatio = 0.075;  // 超过视口 25% 即切换
  const velocityNeed = 0.5;     // 或速度超过 0.6 px/ms
  const getW = () => pageEl.clientWidth || 1;

  function onStart(clientX, clientY){
    startX = clientX; startY = clientY; startT = performance.now();
    dragging = false; dx = 0;
  }
  function onMove(clientX, clientY, rawEvent){
    const moveX = clientX - startX;
    const moveY = clientY - startY;
    if (!dragging) {
      if (Math.abs(moveX) > 8 && Math.abs(moveX) > Math.abs(moveY)) {
        dragging = true;
        slidesEl.style.transition = 'none';
      } else {
        return; // 还没判定为水平拖动
      }
    }
    dx = moveX;
    const percent = (-activeIndex * 100) + (dx / getW() * 100);
    slidesEl.style.transform = `translateX(${percent}%)`;
    // 防止拖动时页面（或父容器）跟着滚
    if (rawEvent && rawEvent.cancelable) rawEvent.preventDefault();
  }
  function onEnd(){
    if (!dragging) return;
    const dt = Math.max(1, performance.now() - startT);
    const v = Math.abs(dx) / dt; // px/ms
    const goPrev = dx > 0;
    const ratio = Math.abs(dx) / getW();

    let target = activeIndex;
    if (ratio > thresholdRatio || v > velocityNeed) {
      target = goPrev ? activeIndex - 1 : activeIndex + 1;
    }
    target = Math.max(0, Math.min(DAY_ORDER.length - 1, target));

    slidesEl.style.transition = ''; // 恢复过渡
    activeIndex = target;
    activateTab(keyByIndex(activeIndex), true);
  }

  // Touch
  pageEl.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, {passive: true});
  pageEl.addEventListener('touchmove', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    onMove(t.clientX, t.clientY, e);
  }, {passive: false});
  pageEl.addEventListener('touchend', onEnd, {passive: true});
  pageEl.addEventListener('touchcancel', onEnd, {passive: true});

  // Mouse（桌面端）
  let mouseDown = false;
  pageEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    mouseDown = true;
    onStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (!mouseDown) return;
    onMove(e.clientX, e.clientY, e);
  });
  window.addEventListener('mouseup', () => {
    if (!mouseDown) return;
    mouseDown = false;
    onEnd();
  });

  // 键盘左右切换（可选）
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      activateTab(keyByIndex(activeIndex - 1), true);
    } else if (e.key === 'ArrowRight') {
      activateTab(keyByIndex(activeIndex + 1), true);
    }
  });
}

/* =============== 时钟 & 动态刷新 =============== */
function startClock(){
  function tick(){
    const d = nowLisbon();
    const y = d.getFullYear(), mo = pad(d.getMonth()+1), da = pad(d.getDate());
    const minuteSig = `${y}-${mo}-${da} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const todayKey = todayKeyLisbon();

    if (minuteSig !== lastMinuteSig) {
      lastMinuteSig = minuteSig;

      // 跨天：如果用户仍停留在“昨天的今天页”，就自动跟随到新的一天
      if (lastTodayKey && todayKey !== lastTodayKey && activeDayKey === lastTodayKey) {
        renderSlide(lastTodayKey, false);
        renderSlide(todayKey, false);
        activateTab(todayKey, true);
      } else if (activeDayKey === todayKey) {
        // 仍在今天页：刷新高亮，不自动滚动
        renderSlide(todayKey, false);
      } else {
        // 其他情况：当日 slide 的高亮可能变化，轻量刷新但不打扰用户
        renderSlide(todayKey, false);
      }
      lastTodayKey = todayKey;
    }
  }
  tick();
  setInterval(tick, 1000); // 秒级走时；状态按“分钟签名”变化时刷新
}

/** 初始化：构建滑动轨道 + 事件 + 打开今天 */
function init(){
  pageEl = document.getElementById('page');

  // ============== 修改点：在初始化时调用日期更新函数 ==============
  updateTabDates();

  // 构建滑动容器（5页）
  buildSlides();

  // 顶部 tab 点击
  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => activateTab(el.dataset.day, true));
  });

  // 默认打开“今天”
  const t = todayKeyLisbon();
  lastTodayKey = t;
  activateTab(t, false); // 首次定位无需动画

  // 安装滑动手势
  installSwipe();

  // Fénix 教室详情弹窗
  const roomModal = document.getElementById('roomModal');
  const roomClose = document.getElementById('roomClose');

  roomClose.addEventListener('click', closeRoomInfo);

  roomModal.addEventListener('click', (e) => {
    if (e.target === roomModal) closeRoomInfo();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && roomModal.classList.contains('open')) {
      closeRoomInfo();
    }
  });

  // 安装企业级 Blueprint 缩放 / 拖动 / 触控 / 全屏查看器
  installBlueprintViewer();

  // 启动时钟与自动刷新
  startClock();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
