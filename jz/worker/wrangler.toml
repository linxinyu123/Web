name = "cashew-private-api"
main = "index.mjs"
compatibility_date = "2026-01-01"

[vars]
# Exact origins only, without trailing slash. Add your GitHub Pages origin when deploying.
ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "cashew"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cashew-private"

# Set API_TOKEN via `npx wrangler secret put API_TOKEN`, never in this file.
