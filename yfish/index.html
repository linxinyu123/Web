const STORIES=[
 {id:'charles',type:'Atualidade',date:'10 nov 2026',source:'DGRM',url:'https://www.dgrm.pt/destaques?articleId=926918',title:'Depressão Charles: fish stocks to the moon?',deck:'A DGRM alertou para vento forte e agitação marítima, recomendando aos profissionais da pesca que adiassem as saídas nas zonas afetadas.',body:['A Direção-Geral de Recursos Naturais, Segurança e Serviços Marítimos publicou em 10 de novembro de 2026 um aviso sobre a depressão Charles. Segundo esse aviso, o estado do mar deveria agravar-se entre o final de 10 e o meio-dia de 12 de novembro.','A autoridade recomendou aos profissionais da pesca e da náutica de recreio que adiassem as saídas nas zonas afetadas enquanto persistissem as condições adversas.','Leitura de mercado: menos saídas podem diminuir temporariamente a oferta de pescado fresco. O efeito concreto nas descargas e nos preços não foi quantificado pela fonte citada; qualquer projeção desse impacto é apenas um cenário.'],asset:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=80',contracts:['SRD','CRP','RBL'],featured:true},
 {id:'elnino',type:'Mercados',date:'23 jul 2026',source:'FAO / GLOBEFISH',url:'https://www.fao.org/in-action/globefish/news-events/news/news-detail/china-demand-and-lower-quotas-lift-fishmeal-and-fish-oil-prices/en',title:'Anchovas, El Niño e a pressão sobre a farinha de peixe',deck:'Quotas reduzidas e risco climático criaram tensões na oferta de farinha e óleo de peixe em 2026.',body:['A FAO/GLOBEFISH descreveu uma redução das quotas de anchova no Peru e no Chile, juntamente com risco crescente associado ao El Niño. Esses fatores contribuíram para um mercado internacional de farinha e óleo de peixe mais apertado.','A mesma análise indicou que a farinha de peixe super prime, FOB Peru, passou de cerca de 1 400 USD/t um ano antes para 2 500 USD/t em maio de 2026. Este valor refere-se a farinha de peixe, não ao preço de retalho de anchova fresca.','A eventual substituição da farinha de peixe por ingredientes de soja em rações é uma hipótese económica relevante; não é correto afirmar, sem dados adicionais, que o El Niño tenha por si só causado um aumento da produção mundial de soja.'],asset:'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=900&q=80',contracts:['ANC','SRD']},
 {id:'chain',type:'Análise',date:'Cenário YFISH',source:'Laboratório YFISH',url:'',title:'Da lota à Xstation: como proteger a cadeia de frio',deck:'Um exercício sobre embalagem reutilizável, acondicionamento, rastreabilidade e levantamento.',body:['No modelo YFISH, o peixe é preparado por parceiros, acondicionado em PACK compatível e registado como Encomenda de Serviço para levantamento em Xstation, quando autorizado.','O UoD do eXange não garante, por si só, refrigeração das Xstation. A preservação da cadeia de frio exigiria validação operacional e, se necessário, capacidade adicional explicitamente especificada.','A plataforma mantém os seus próprios dados de lote, origem, qualidade declarada e cliente. A interação com a Xstation é intermediada pela Xmiddle, sem comandos diretos.'],asset:'https://images.unsplash.com/photo-1535399831218-d5bd36d1a6b3?auto=format&fit=crop&w=900&q=80',contracts:['PSS','ATM']},
 {id:'fukushima',type:'Documentários',date:'11 mar 2011',source:'AIEA / IAEA',url:'https://gnssn.iaea.org/FukushimaLessonsLearned/SitePages/default.aspx',title:'Fukushima: o tsunami que mudou o litoral japonês',deck:'O sismo e tsunami de 2011, o acidente nuclear e as questões sobre comunidades costeiras e segurança alimentar.',body:['Em 11 de março de 2011, um sismo de grande magnitude provocou um tsunami que atingiu o nordeste do Japão. A central de Fukushima Daiichi sofreu falhas graves de alimentação e arrefecimento, desencadeando um acidente nuclear.','Este dossiê histórico aborda o desastre e o seu contexto, sem reduzir os efeitos ambientais a afirmações simplistas sobre todos os produtos do mar. O acompanhamento dos efeitos, a fiscalização e as regras de segurança devem apoiar-se em fontes científicas e regulatórias.','Conteúdo editorial escrito para este protótipo, não é um vídeo alojado nem uma produção audiovisual original. O botão de fonte permite aprofundar a investigação da AIEA.'],asset:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1100&q=80',contracts:[]},
 {id:'boja',type:'Documentários',date:'1434',source:'NOVA FCSH',url:'https://eve.fcsh.unl.pt/pt/pessoas/gil-eanes',title:'Gil Eanes e o Cabo Bojador: vencer a fronteira do Atlântico',deck:'Uma viagem pela navegação portuguesa, pelas rotas do século XV e pelos encontros e conflitos que se seguiram.',body:['Em 1434, Gil Eanes dobrou o Cabo Bojador, na costa ocidental africana, ao serviço do Infante D. Henrique, segundo a historiografia portuguesa.','Este marco costuma ser apresentado como uma etapa da expansão marítima portuguesa. A análise histórica deve considerar também os seus efeitos posteriores, incluindo violência, captura de pessoas e tráfico de escravizados nas viagens de expansão.','Conteúdo editorial histórico de demonstração; não é um documentário audiovisual. A ligação conduz à Enciclopédia Virtual da Expansão Portuguesa, da NOVA FCSH.'],asset:'https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?auto=format&fit=crop&w=1100&q=80',contracts:[]}

const STORY_TRANSLATIONS = {"charles":{"en":{"title":"Storm Charles: fish stocks to the moon?","deck":"Portugal’s maritime authority advised fishers in affected areas to postpone departures amid strong winds and rough seas.","body":["On 10 November 2026, Portugal’s Directorate-General for Natural Resources, Safety and Maritime Services (DGRM) published a warning about Storm Charles. It anticipated worsening sea conditions from late 10 November until midday on 12 November.","The authority recommended that fishing crews and recreational sailors in affected areas postpone departures while the adverse conditions lasted.","Market interpretation: fewer fishing trips could temporarily reduce fresh fish supply. The cited notice did not quantify the effects on landings or prices; any estimated effect is a hypothetical scenario."]},"cn":{"title":"查尔斯风暴：鱼类价格要暴涨了吗？","deck":"葡萄牙海事部门提示部分海域将出现大风浪，建议相关渔民暂缓出海。","body":["2026 年 11 月 10 日，葡萄牙自然资源、安全和海事服务总局（DGRM）发布查尔斯风暴预警，指出从 10 日晚至 12 日中午，部分海域海况可能恶化。","官方建议受影响地区的专业渔民及休闲航海人员，在恶劣天气持续期间推迟出海。","市场解读：减少出海可能暂时减少鲜鱼供应。但这份公告没有统计实际上岸量或价格变化，因此任何价格影响只能作为假设性情景，不是已证实的结果。"]}},"elnino":{"en":{"title":"Anchovies, El Niño and pressure on fishmeal markets","deck":"Reduced quotas and climate risks tightened fishmeal and fish-oil supply in 2026.","body":["FAO/GLOBEFISH described lower anchovy quotas in Peru and Chile alongside growing risks associated with El Niño, contributing to tight fishmeal and fish-oil markets.","Its analysis reported that super-prime fishmeal, FOB Peru, rose from roughly USD 1,400 per tonne a year earlier to USD 2,500 per tonne in May 2026. This is the price of fishmeal, not the retail price of fresh anchovies.","Substituting fishmeal with soy-based feed ingredients is an economically relevant possibility. Without additional data, however, it would be wrong to claim that El Niño alone increased global soybean production."]},"cn":{"title":"鳀鱼、厄尔尼诺与鱼粉市场的价格压力","deck":"捕捞配额削减和气候风险，使 2026 年鱼粉及鱼油供应趋紧。","body":["联合国粮农组织 FAO/GLOBEFISH 指出，秘鲁与智利削减鳀鱼捕捞配额，同时厄尔尼诺相关风险上升，这些因素使国际鱼粉和鱼油市场供应更加紧张。","该分析提到，秘鲁离岸价的超优质鱼粉价格从上一年约 1,400 美元/吨，升至 2026 年 5 月约 2,500 美元/吨。注意：这是鱼粉价格，不是新鲜鳀鱼的零售价格。","动物饲料中用大豆原料替代部分鱼粉是一种合理的经济假设，但缺乏更多数据时，不能断言厄尔尼诺单独导致全球大豆产量上升。"]}},"chain":{"en":{"title":"From fish market to Xstation: protecting the cold chain","deck":"A case study of reusable packaging, conditioning, traceability and pickup.","body":["In the YFISH concept, partner sellers prepare fish, pack it in compatible reusable PACK and register it as a Service Parcel for collection at an Xstation when authorized.","The eXange universe of discourse does not, by itself, guarantee refrigeration in Xstation machines. Maintaining the cold chain would require operational validation and, if needed, an explicitly specified additional capability.","YFISH keeps its own batch, origin, quality and customer data. All interactions with an Xstation are mediated through Xmiddle; it issues no direct station commands."]},"cn":{"title":"从鱼市到 Xstation：如何保护冷链","deck":"探索可重复使用包装、温度保障、溯源与自助取货。","body":["在 YFISH 模型中，合作鱼贩处理海鲜，采用兼容的可重复使用 PACK 包装，在获得授权后将其登记为“服务包裹”，供用户在 Xstation 取货。","eXange 的 UoD 并没有自动保证 Xstation 具备制冷能力。要真正保持冷链，需要运营验证；如果需要额外制冷功能，必须明确提出并说明这一扩展。","YFISH 负责管理自身的批次、产地、申报等级和用户数据。与 Xstation 的交互必须经过 Xmiddle 中介，不能向站点直接发命令。"]}},"fukushima":{"en":{"title":"Fukushima: the tsunami that transformed Japan’s coast","deck":"The 2011 earthquake, tsunami and nuclear accident, and their consequences for coastal communities and food safety.","body":["On 11 March 2011, a major earthquake triggered a tsunami that hit north-eastern Japan. Fukushima Daiichi nuclear power station experienced serious power and cooling failures, leading to a nuclear accident.","This historical dossier places the disaster in context without reducing environmental impacts to simplistic claims about all seafood. Monitoring, regulation and assessments should rest on scientific and regulatory sources.","This is written editorial content for the prototype, not a hosted video or original documentary film. The source link leads to the IAEA’s research materials."]},"cn":{"title":"福岛：改变日本海岸线的海啸","deck":"回顾 2011 年地震、海啸、核事故及其对沿海社区和食品安全的影响。","body":["2011 年 3 月 11 日，日本东北地区遭遇大地震与海啸。福岛第一核电站出现严重断电及冷却系统故障，最终引发核事故。","这篇历史专题解释灾害背景，但不会把复杂的环境影响简化成“所有海产品都不安全”等不科学的断言。相关环境监测、食品监管和评估应以科学研究及监管机构资料为依据。","本专题为原型中的原创文字内容，不是内嵌视频或纪录片。来源链接指向国际原子能机构（IAEA）的相关研究资料。"]}},"boja":{"en":{"title":"Gil Eanes and Cape Bojador: beyond the Atlantic frontier","deck":"Portuguese voyages in the 15th century, their routes, encounters and conflicts.","body":["According to Portuguese historical scholarship, Gil Eanes rounded Cape Bojador on the West African coast in 1434 while serving Prince Henry the Navigator.","The voyage is often presented as a milestone in Portuguese overseas expansion. A critical account must also consider the violence, captive-taking and trade in enslaved people that accompanied later expeditions.","This is a historical text dossier for demonstration, not an audiovisual documentary. The link leads to NOVA FCSH’s Virtual Encyclopedia of Portuguese Expansion."]},"cn":{"title":"吉尔·埃阿内斯与博哈多尔角：跨越大西洋边界","deck":"回顾 15 世纪葡萄牙航海、航线拓展以及随之而来的交流与冲突。","body":["根据葡萄牙历史研究记载，1434 年吉尔·埃阿内斯（Gil Eanes）奉航海家恩里克王子之命，绕过西非海岸的博哈多尔角。","这段航行通常被视为葡萄牙海外扩张的重要节点。但完整的历史叙述也必须讨论之后的航海扩张所伴随的暴力、人口掠夺和奴隶贸易。","这是用于演示的历史图文专题，不是影视纪录片。来源链接指向 NOVA FCSH 的《葡萄牙海外扩张虚拟百科全书》。"]}}};

STORIES.unshift(...[{"id":"groenlandia","type":"Ensaio","date":"12 nov 2026","source":"Arctic Science · DTU Aqua","url":"https://doi.org/10.1139/as-2025-0028","asset":"https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1400&q=82","contracts":["PSS","CRP","ANC"],"featured":true,"title":"Aquecimento global, Gronelândia e peixes","deck":"O degelo e a subida da temperatura do oceano alteram habitats e pescarias. Quem ganha, quem perde — e o que ainda não sabemos?","body":["O aquecimento global não altera apenas a paisagem gelada da Gronelândia. Também modifica a temperatura da água, a cobertura de gelo marinho e a disponibilidade de alimento, fatores que moldam a distribuição das espécies de peixe. Os seus efeitos variam entre regiões e espécies: não existe um único resultado para «a pesca da Gronelândia».","Um estudo publicado em Arctic Science em 2026, que combina dados de arrasto científico com conhecimento local e indígena, encontrou um declínio do bacalhau-do-Ártico (Boreogadus saida) e uma deslocação da sua distribuição para norte nas águas da Gronelândia desde o início dos anos 1990. Este peixe não deve ser confundido com o bacalhau-do-Atlântico, Gadus morhua, que tem uma ecologia e uma importância comercial diferentes.","A mudança pode repercutir-se em toda a cadeia alimentar: peixes pequenos alimentam predadores, incluindo focas e aves marinhas. À medida que alguns organismos se deslocam, podem alterar-se também as zonas de pesca, os custos das deslocações e o calendário das capturas. A mudança não garante ganhos económicos: mais acesso a certas águas não equivale automaticamente a stocks sustentáveis.","Para os mercados, a ligação plausível é indireta. Se a abundância, o esforço de pesca ou a logística mudarem, a oferta poderá variar; mas a formação dos preços depende também de quotas, combustível, custos, procura, transformação e comércio internacional. Não é possível deduzir o preço futuro de uma espécie apenas a partir do degelo.","Na YFISH, este tema integra o observatório de mercado como análise editorial. Os contratos e gráficos da Bolsa do Mar são fictícios e não traduzem previsões científicas sobre a Gronelândia. Fonte principal: Jansen e colaboradores, Arctic Science (2026), DOI 10.1139/as-2025-0028."],"i18n":{"pt":{"title":"Aquecimento global, Gronelândia e peixes","deck":"O degelo e a subida da temperatura do oceano alteram habitats e pescarias. Quem ganha, quem perde — e o que ainda não sabemos?","body":["O aquecimento global não altera apenas a paisagem gelada da Gronelândia. Também modifica a temperatura da água, a cobertura de gelo marinho e a disponibilidade de alimento, fatores que moldam a distribuição das espécies de peixe. Os seus efeitos variam entre regiões e espécies: não existe um único resultado para «a pesca da Gronelândia».","Um estudo publicado em Arctic Science em 2026, que combina dados de arrasto científico com conhecimento local e indígena, encontrou um declínio do bacalhau-do-Ártico (Boreogadus saida) e uma deslocação da sua distribuição para norte nas águas da Gronelândia desde o início dos anos 1990. Este peixe não deve ser confundido com o bacalhau-do-Atlântico, Gadus morhua, que tem uma ecologia e uma importância comercial diferentes.","A mudança pode repercutir-se em toda a cadeia alimentar: peixes pequenos alimentam predadores, incluindo focas e aves marinhas. À medida que alguns organismos se deslocam, podem alterar-se também as zonas de pesca, os custos das deslocações e o calendário das capturas. A mudança não garante ganhos económicos: mais acesso a certas águas não equivale automaticamente a stocks sustentáveis.","Para os mercados, a ligação plausível é indireta. Se a abundância, o esforço de pesca ou a logística mudarem, a oferta poderá variar; mas a formação dos preços depende também de quotas, combustível, custos, procura, transformação e comércio internacional. Não é possível deduzir o preço futuro de uma espécie apenas a partir do degelo.","Na YFISH, este tema integra o observatório de mercado como análise editorial. Os contratos e gráficos da Bolsa do Mar são fictícios e não traduzem previsões científicas sobre a Gronelândia. Fonte principal: Jansen e colaboradores, Arctic Science (2026), DOI 10.1139/as-2025-0028."]},"en":{"title":"Global Warming, Greenland, and Fish","deck":"Melting ice and warmer seas reshape habitats and fisheries. Who might benefit, who faces risks, and what remains uncertain?","body":["Global warming is changing more than Greenland’s icy landscape. It also affects seawater temperature, sea-ice cover and food availability, all of which influence where fish species can live. Impacts vary by region and species; there is no single outcome for “Greenland’s fisheries”.","A 2026 Arctic Science study combining scientific trawl surveys with local and Indigenous knowledge reported a decline in Arctic cod (Boreogadus saida) and a northward shift in its distribution in Greenlandic waters since the early 1990s. Arctic cod must not be confused with Atlantic cod (Gadus morhua), a different species with distinct commercial significance.","Those changes may ripple through the food web: small fish sustain predators including seals and seabirds. As distributions shift, fishing grounds, travel costs and catch seasons may shift too. Greater access to certain waters does not automatically translate into sustainable catches or economic gains.","The market connection is indirect. Changes in abundance, fishing effort or logistics might affect supply, but prices also depend on quotas, fuel, demand, processing capacity and international trade. Melting ice alone cannot predict future prices.","At YFISH, this is editorial market analysis, not an investment signal. Bolsa do Mar quotes and contracts are fictional and do not express scientific price forecasts for Greenland. Main source: Jansen et al., Arctic Science (2026), DOI 10.1139/as-2025-0028."]},"cn":{"title":"全球变暖、格陵兰与鱼类","deck":"海冰减少与海水升温正在重塑渔业生态。谁可能受益，谁承担风险，又有哪些未知？","body":["全球变暖改变的不只是格陵兰冰雪覆盖的景观。海水温度、海冰范围和食物供给也在变化，进而影响鱼类适合生存的区域。不同海域和物种的反应不一样，不能把“格陵兰渔业”概括成统一的赢家或输家。","2026 年发表于《Arctic Science》的一项研究，结合科学拖网调查和当地及原住民知识，发现自 1990 年代初以来，格陵兰海域的北极鳕（Boreogadus saida）数量下降，分布向北迁移。这里的北极鳕不等于商业上常说的大西洋鳕（Gadus morhua），两者是不同物种。","鱼类迁移还会影响食物网：小型鱼是海豹、海鸟等捕食者的重要食物。鱼群移动后，捕捞地点、航程成本和渔期都可能随之变化。但某些水域更容易进入，并不意味着捕捞量一定增加，更不意味着渔业一定可持续。","对于市场，影响链条是间接的。鱼群丰度、捕捞努力和物流变化可能影响供给，但价格同时受配额、燃油、消费需求、加工能力及国际贸易左右。因此不能仅凭海冰融化就预测某种鱼的期货价格。","在 YFISH 中，这是一篇科学依据明确的市场分析，并非投资信号。“海洋交易所”的行情和合约仍为虚构模拟，不代表针对格陵兰的科学价格预测。主要来源：Jansen 等，《Arctic Science》（2026），DOI：10.1139/as-2025-0028。"]}}},{"id":"ensaio","type":"Ensaio","date":"12 nov 2026","source":"Fishy Times · Ensaio","url":"","asset":"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1300&q=82","contracts":["SRD","ANC","ATM"],"title":"FFs — Fish Futures: o futuro do mercado do peixe","deck":"Ensaio sobre os FFs (Fish Futures), a cobertura de risco e os limites da especulação.","body":["Um peixe é, antes de mais, alimento. Mas muito antes de chegar à mesa é também trabalho, combustível, rede, gelo, tempo e incerteza. A sua cotação resulta de decisões tomadas no mar e em terra; não cabe num único número a piscar a verde ou a vermelho.","Os contratos de futuros nasceram, entre outras razões, da necessidade de reduzir a incerteza. Em teoria, um produtor pode fixar antecipadamente um preço de venda e um comprador pode limitar o risco de uma subida inesperada. O objetivo de cobertura de risco (hedging) é diferente do objetivo de apostar numa variação de preços.","No pescado, porém, a operação levanta problemas difíceis. O peixe não é um produto perfeitamente homogéneo: variam a espécie, o tamanho, a frescura, o método de captura, a época e o local de desembarque. Um contrato que ignore essas diferenças poderá ter um preço elegante e uma utilidade económica escassa.","A especulação pode acrescentar liquidez, mas também amplificar conflitos de interesse ou interpretações enganosas, sobretudo num mercado pouco profundo. O que protege um pescador pode expor outro participante a perdas; um gráfico em tempo real não equivale a transparência se a origem dos dados for obscura.","Por isso, uma plataforma responsável deve distinguir três coisas: a transação física do pescado, a informação pública sobre oferta e procura e os instrumentos financeiros que exigiriam regras, supervisão e contrapartes reais. Misturá-las sem uma fronteira clara seria uma falha de conceção, não uma inovação.","A YFISH propõe uma hipótese de aprendizagem: visualizar preços simulados, explorar cenários e compreender riscos sem movimentar dinheiro real. A ideia mais promissora não é transformar cada sardinha numa aposta; é usar melhores dados para que produtores, comerciantes e consumidores tomem decisões mais informadas. Este texto é um ensaio de opinião, não aconselhamento financeiro."],"i18n":{"pt":{"title":"FFs — Fish Futures: o futuro do mercado do peixe","deck":"Ensaio sobre os FFs (Fish Futures), a cobertura de risco e os limites da especulação.","body":["Um peixe é, antes de mais, alimento. Mas muito antes de chegar à mesa é também trabalho, combustível, rede, gelo, tempo e incerteza. A sua cotação resulta de decisões tomadas no mar e em terra; não cabe num único número a piscar a verde ou a vermelho.","Os contratos de futuros nasceram, entre outras razões, da necessidade de reduzir a incerteza. Em teoria, um produtor pode fixar antecipadamente um preço de venda e um comprador pode limitar o risco de uma subida inesperada. O objetivo de cobertura de risco (hedging) é diferente do objetivo de apostar numa variação de preços.","No pescado, porém, a operação levanta problemas difíceis. O peixe não é um produto perfeitamente homogéneo: variam a espécie, o tamanho, a frescura, o método de captura, a época e o local de desembarque. Um contrato que ignore essas diferenças poderá ter um preço elegante e uma utilidade económica escassa.","A especulação pode acrescentar liquidez, mas também amplificar conflitos de interesse ou interpretações enganosas, sobretudo num mercado pouco profundo. O que protege um pescador pode expor outro participante a perdas; um gráfico em tempo real não equivale a transparência se a origem dos dados for obscura.","Por isso, uma plataforma responsável deve distinguir três coisas: a transação física do pescado, a informação pública sobre oferta e procura e os instrumentos financeiros que exigiriam regras, supervisão e contrapartes reais. Misturá-las sem uma fronteira clara seria uma falha de conceção, não uma inovação.","A YFISH propõe uma hipótese de aprendizagem: visualizar preços simulados, explorar cenários e compreender riscos sem movimentar dinheiro real. A ideia mais promissora não é transformar cada sardinha numa aposta; é usar melhores dados para que produtores, comerciantes e consumidores tomem decisões mais informadas. Este texto é um ensaio de opinião, não aconselhamento financeiro."]},"en":{"title":"FFs — Fish Futures: The Future of Fish Markets","deck":"An essay on Fish Futures (FFs), hedging and the limits of speculation.","body":["Fish are, first and foremost, food. Long before they reach a plate, they also embody labour, fuel, nets, ice, time and uncertainty. A quoted price reflects decisions made at sea and on land; it cannot be reduced to a single flashing green or red number.","Futures contracts emerged in part to manage uncertainty. In principle, producers can lock in a selling price and buyers can limit their exposure to unexpected increases. Hedging price risk is fundamentally different from betting on a price change.","Seafood nevertheless presents difficult design problems. Fish are not perfectly uniform goods: species, size, freshness, catch method, season and landing port all matter. A contract that ignores those differences may produce a neat chart but little practical benefit.","Speculation can contribute liquidity. In thin markets, however, it may also magnify conflicts of interest and misleading signals. A hedge that protects one fisher may expose someone else to losses; “real-time” is not the same as transparent if the data source is unknown.","A responsible platform must therefore separate physical fish transactions, public supply-and-demand intelligence, and regulated financial instruments that would require real counterparties and oversight. Collapsing those boundaries would be poor system design, not innovation.","YFISH offers an educational experiment: simulated quotes, scenario exploration and risk awareness without moving real money. The more promising idea is not to turn every sardine into a bet, but to use better information to help producers, traders and consumers make decisions. This is an opinion essay, not financial advice."]},"cn":{"title":"FFs（Fish Futures）：鱼类期货与市场的未来","deck":"关于鱼类期货（FFs）、价格风险对冲与投机边界的议论文。","body":["鱼首先是食物。但在进入餐桌之前，它承载的还有渔民的劳动、燃油、渔网、冰块、时间以及不确定性。一条价格曲线包含了海上和陆上的各种决策，不能被简化成不停闪烁的红绿数字。","期货合约出现的重要原因之一，是管理不确定性。理论上，生产者可以提前锁定售价，买方可以限制成本意外上升的风险。这种套期保值与单纯押注价格涨跌，是两种不同的目的。","然而，鱼类市场很难直接照搬标准化合约。鱼并不是完全同质的商品：物种、体型、鲜度、捕捞方式、季节和上岸港口都影响价值。忽略这些差异的合约，图表可能精美，却未必有多少真实经济用途。","投机有可能增加市场流动性，但在交易稀薄的市场中，也可能放大利益冲突和误导性信号。能够保护一个渔民的对冲安排，可能让另一个参与者承担损失；如果数据来源不透明，“实时”并不等于透明。","因此，负责任的平台必须区分三件事：真实鱼货交易、供需信息服务，以及需要监管和真实交易对手的金融工具。如果把它们混在一起，并不是创新，而是系统设计中的边界错误。","YFISH 提供一种学习性的探索：用模拟行情理解价格、情景和风险，而不涉及真实资金。真正值得尝试的不是把每条沙丁鱼变成赌注，而是让渔民、商家和消费者依靠更可靠的信息做决定。本文为观点性议论文，不构成投资建议。"]}}}]);

const nodeOrigins=new WeakMap(),attrOrigins=new WeakMap();
function tr(value){const raw=String(value??'');if(S.lang==='pt')return raw;const norm=raw.trim().replace(/\s+/g,' ');const result=UI_DICT[norm]?.[S.lang];if(result!==undefined)return raw.slice(0,raw.indexOf(norm)) + result + raw.slice(raw.indexOf(norm)+norm.length);
 let dyn=norm.match(/^(\d+) produtos$/);if(dyn)return S.lang==='en'?`${dyn[1]} products`:`${dyn[1]} 件商品`;
 dyn=norm.match(/^Pedido (.+)$/);if(dyn)return S.lang==='en'?`Order ${dyn[1]}`:`订单 ${dyn[1]}`;
 dyn=norm.match(/^Lance mínimo:\s*(.+?)\s*·\s*Incremento:\s*(.+)$/);if(dyn)return S.lang==='en'?`Minimum bid: ${dyn[1]} · Increment: ${dyn[2]}`:`最低出价：${dyn[1]} · 加价幅度：${dyn[2]}`;
 if(raw.length>7){let localized=raw;for(const [pt,v] of UI_PARTIALS){if(localized.includes(pt))localized=localized.replaceAll(pt,v[S.lang]);}return localized;}return raw;
}
const UI_PARTIALS=Object.entries(UI_DICT).filter(([k])=>k.length>=12&& !k.includes('·') && !k.includes('€')).sort((a,b)=>b[0].length-a[0].length);
function translateDOM(root){if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){return n.parentElement?.closest('script,style,svg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});let n;while((n=walker.nextNode())){if(!nodeOrigins.has(n))nodeOrigins.set(n,n.textContent);let orig=nodeOrigins.get(n);if(orig&&orig.trim()){const v=tr(orig);if(n.textContent!==v)n.textContent=v}}
 const elements=[root,...root.querySelectorAll('*')];for(const el of elements){for(const attr of ['placeholder','aria-label','title']){if(!el.hasAttribute?.(attr))continue;let rec=attrOrigins.get(el);if(!rec){rec={};attrOrigins.set(el,rec)}if(!(attr in rec))rec[attr]=el.getAttribute(attr);const v=tr(rec[attr]);if(v!==el.getAttribute(attr))el.setAttribute(attr,v)}}}
function translateChrome(){translateDOM(document.querySelector('.topbar'));translateDOM(document.querySelector('.footerline'));translateDOM(document.querySelector('.mobile-tab'));translateDOM(document.querySelector('.desktop-nav'));}
function changeLang(lang){if(!['pt','en','cn'].includes(lang)||lang===S.lang)return;S.lang=lang;try{localStorage.setItem('yfish_lang_v2',lang)}catch{};if(S.modal)closeModal();document.querySelectorAll('.page').forEach(p=>p.innerHTML='');renderActive(true);}

let toastTimer;function toast(message){const t=node('toast');t.textContent=tr(message);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function renderActive(rebuild=true){renderNav();document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===`page-${S.nav}`));const view=node(`page-${S.nav}`);if(!view)return;switch(S.nav){case 'inicio':view.innerHTML=renderHome();renderSparks();break;case 'peixaria':if(rebuild||!view.innerHTML)view.innerHTML=renderShop();break;case 'bolsa':view.innerHTML=renderMarket();requestAnimationFrame(()=>{drawChart();bindChart()});break;case 'carteira':view.innerHTML=renderPortfolio();break;case 'noticias':if(rebuild||!view.innerHTML)view.innerHTML=renderNews();break;case 'leiloes':if(rebuild||!view.innerHTML)view.innerHTML=renderAuctions();break;case 'mare':if(rebuild||!view.innerHTML)view.innerHTML=renderMembership();break;case 'pedidos':if(rebuild||!view.innerHTML)view.innerHTML=renderOrders();break;}node('cart-counter').textContent=S.cart.reduce((t,it)=>t+it.qty,0);translateDOM(view);translateChrome()}

function renderSparks(){const canvas=node('spark-hero');if(canvas){const series=CONTRACTS[0]&&q('SRD').series;drawSpark(canvas,series,'#67dfc5',true)}}
function drawSpark(canvas,series,color,fill=false){if(!canvas)return;let w=canvas.clientWidth||270,h=canvas.clientHeight||75,dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const vals=series.slice(-90),lo=Math.min(...vals),hi=Math.max(...vals),spread=hi-lo||1;ctx.beginPath();vals.forEach((v,i)=>{const x=2+i/(vals.length-1)*(w-4),y=h-7-(v-lo)/spread*(h-17);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(fill){ctx.save();ctx.lineTo(w-2,h);ctx.lineTo(2,h);ctx.closePath();ctx.fillStyle='rgba(45,218,187,.11)';ctx.fill();ctx.restore();ctx.beginPath();vals.forEach((v,i)=>{const x=2+i/(vals.length-1)*(w-4),y=h-7-(v-lo)/spread*(h-17);i?ctx.lineTo(x,y):ctx.moveTo(x,y)})}ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke()}

ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e9eef2';ctx.lineWidth=1;ctx.fillStyle='#92a1ac';ctx.font='11px DM Sans, system-ui';for(let i=0;i<=4;i++){let yp=T+i*plotH/4;ctx.beginPath();ctx.moveTo(L,yp);ctx.lineTo(w-R,yp);ctx.stroke();ctx.textAlign='right';ctx.fillText((max-i*(max-min)/4).toFixed(2).replace('.',','),L-9,yp+4)}ctx.textAlign='center';['−'+(n===35?'45 min':n===100?'1 dia':n===180?'1 sem':'1 mês'),'−'+(n===35?'20 min':n===100?'12 h':n===180?'3 dias':'15 dias'),'Agora'].forEach((s,i)=>ctx.fillText(s,L+i*plotW/2,h-8));const positive=series.at(-1)>=series[0];ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.lineTo(x(series.length-1),T+plotH);ctx.lineTo(L,T+plotH);ctx.closePath();const gradient=ctx.createLinearGradient(0,T,0,T+plotH);gradient.addColorStop(0,positive?'rgba(13,160,128,.16)':'rgba(221,88,84,.13)');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle=positive?'#0c9b7b':'#dd6666';ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();const last=series.at(-1);ctx.beginPath();ctx.arc(x(series.length-1),y(last),4,0,Math.PI*2);ctx.fillStyle=positive?'#0c9b7b':'#dd6666';ctx.fill();canvas._chart={series,L,R,T,B,plotW,plotH,min,max,x,y};

function timeLeft(ms){if(ms<=0)return 'Encerrado';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h?`${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderAuctions(){const lots=Object.values(CATALOG.items).filter(p=>p.auction);return `${header('Leilão da Lota','Peças selecionadas. Licite o lote completo, não apenas o preço por quilo.',`<div class="row wrap"><span class="pill ${S.membership?'green':'orange'}">${S.membership?'Maré+ ativo':'Exclusivo Maré+'}</span><button class="btn ghost sm" data-action="restart-auctions" title="Começar uma nova sessão de demonstração">Reiniciar sessão</button></div>`)}<div class="shop-banner" style="background:#253549"><div class="eyebrow" style="color:#98d9d3;margin-bottom:7px">Lances em curso · Simulação</div><h2>Peixe extraordinário. Lotes únicos.</h2><p>A licitação é demonstrativa e guardada neste navegador. O vencedor de um lote real precisaria de confirmar preparação, pagamento e recolha.</p></div><div class="lots">${lots.map(p=>{const a=lotState(p),meta=AUCTION_META[p.id],open=a.ends>Date.now();return `<article class="lot-card"><div class="lot-photo"><img src="${esc(p.image)}" alt="${esc(title(p))}" loading="lazy" onerror="this.style.opacity=0"></div><div class="lot-body"><div class="between"><span class="pill">${meta.weight} kg · lote inteiro</span><span class="pill ${open?'green':'red'}">${open?'Aberto':'Fechado'}</span></div><div class="lot-title">${esc(title(p))}</div><div class="lot-meta">${esc(p.origin)} · ${esc(p.quality)}</div><div class="between"><div><div class="eyebrow" style="margin-bottom:3px">Lance atual</div><div class="lot-count">${money(a.price)}</div></div><div style="text-align:right"><div class="eyebrow" style="margin-bottom:4px">Termina em</div><div class="numeric" style="font-weight:800" data-auction-clock="${p.id}">${timeLeft(a.ends-Date.now())}</div></div></div><div class="lot-meta">Lance mínimo: ${money(a.price+meta.step)} · Incremento: ${money(meta.step)}${a.myBid!==null?`<br><b class="positive">O seu último lance: ${money(a.myBid)}</b>`:''}</div><button class="btn primary sm full" ${!open?'disabled':''} data-bid-open="${p.id}">${open?'Licitar neste lote':'Leilão encerrado'} ${icon('arrow')}</button></div></article>`}).join('')}</div><div class="steps" style="margin-top:21px"><div class="step"><div class="step-index">01 / ESCOLHER</div><h3>Selecionar o lote</h3><p>Conheça a espécie, peso e proveniência declarada.</p></div><div class="step"><div class="step-index">02 / LICITAR</div><h3>Fazer uma oferta</h3><p>Respeite o incremento mínimo de cada lote.</p></div><div class="step"><div class="step-index">03 / RECOLHER</div><h3>Preparação e Xstation</h3><p>Após adjudicação, o fluxo real dependeria do Xmiddle e da disponibilidade da estação.</p></div></div>`}
function bidModal(id){const p=getItem(id),a=lotState(p),m=AUCTION_META[id];if(!p||!m)return;if(!S.membership){navTo('mare');toast('Ative o acesso Maré+ demonstrativo para licitar.');return}if(a.ends<=Date.now())return toast('Este leilão já terminou.');showModal(`<div class="modal-head"><div class="eyebrow">Leilão da Lota · ${esc(id.toUpperCase())}</div><h2 id="dialog-title">${esc(title(p))}</h2></div><div class="modal-body"><div class="grid grid-2" style="gap:13px"><div><img src="${esc(p.image)}" alt="" style="border-radius:14px;width:100%;height:205px;object-fit:cover" onerror="this.style.opacity=0"></div><div class="stack" style="gap:8px"><div class="eyebrow">Lance atual</div><div class="headline-stat">${money(a.price)}</div><div class="muted">${m.weight} kg · ${esc(p.origin)}</div><div class="divider" style="margin:6px 0"></div><div class="detail-pair"><span>Incremento mínimo</span><b>${money(m.step)}</b></div><div class="detail-pair"><span>Termina em</span><b>${timeLeft(a.ends-Date.now())}</b></div><div class="detail-pair"><span>Licitações neste navegador</span><b>${a.bids}</b></div></div></div><label class="control-label" for="bid-value" style="margin-top:19px">O seu lance (€ / lote)</label><div class="row"><input class="input" id="bid-value" inputmode="decimal" type="number" min="${(a.price+m.step).toFixed(2)}" step="0.01" value="${(a.price+m.step).toFixed(2)}"><button class="btn primary" data-submit-bid="${id}">Confirmar lance</button></div><div class="notice yellow" style="margin-top:14px">Não existe contraparte real, caução, adjudicação ou pagamento. Este lance é um registo local de demonstração.</div></div>`)}
function submitBid(id){const p=getItem(id),m=AUCTION_META[id],a=lotState(p),v=Number(node('bid-value')?.value);if(a.ends<=Date.now())return toast('O leilão terminou.');if(!Number.isFinite(v)||v<a.price+m.step-1e-8)return toast(`O lance mínimo é ${money(a.price+m.step)}.`);if(Math.round(v*100)!==v*100&&Math.abs(v*100-Math.round(v*100))>1e-5)return toast('Use no máximo duas casas decimais.');a.price=Math.round(v*100)/100;a.myBid=a.price;a.bids++;a.history.unshift({value:a.price,at:Date.now()});persist();closeModal();renderActive(true);toast('Lance demonstrativo registado. Está a liderar este lote.')}
function renderMembership(){return `${header('Maré+','Uma experiência premium para quem conhece o valor do mar.')}
<div class="grid grid-2" style="align-items:stretch;max-width:1050px"><div class="plan"><span class="pill">Acesso regular</span><div class="plan-name" style="margin-top:16px">YFISH Essencial</div><div class="plan-price">Grátis</div><div class="muted">Para descobrir e comprar peixe fresco.</div><div class="divider"></div><div class="feature-list">${['Catálogo e cabazes do mar','Informação de origem declarada','Encomendas e levantamento Xstation','Fishy Times e cotações simuladas'].map(x=>`<div>${icon('check')} ${x}</div>`).join('')}</div><button class="btn outline full" disabled>Plano atual de base</button></div>
<div class="plan featured"><span class="pill green">Mais solicitado</span><div class="plan-name" style="margin-top:16px">Maré+</div><div class="plan-price">9,90 € <small>/ mês · valor ilustrativo</small></div><div style="font-size:12px;color:#a6c6cf">Seleções, oportunidades e acesso aos leilões.</div><div class="divider" style="background:#416070"></div><div class="feature-list">${['Todos os benefícios Essencial','Acesso demonstrativo ao Leilão da Lota','Coleções premium e seleções sazonais','Prioridade conceptual na preparação'].map(x=>`<div>${icon('check')} ${x}</div>`).join('')}</div><button class="btn ${S.membership?'outline':'primary'} full" data-action="membership">${S.membership?'Desativar adesão de demonstração':'Ativar Maré+ de demonstração'} ${icon('arrow')}</button></div></div><div class="notice" style="max-width:1050px;margin-top:19px">A adesão é apenas um estado local deste protótipo. Não é cobrada qualquer subscrição nem são atribuídas vantagens reais de entrega ou de armazenamento na Xstation.</div>`}
function renderOrders(){return `${header('Encomendas','Pedidos de peixe fresco · Registos guardados neste navegador.',`<button class="btn primary sm" data-nav="peixaria">${icon('bag')} Comprar peixe</button>`)}<div class="panel">${S.orders.length?S.orders.map(o=>`<div class="order-card"><div class="between wrap"><div><b>Pedido ${esc(o.id)}</b><div class="info">${fmtDate.format(new Date(o.at))} · ${esc(o.station)}</div></div><span class="pill orange">Simulado · Sem processamento</span></div><div class="items">${o.items.map(it=>`${esc(it.name)} · ${esc(it.variant)} × ${it.qty}`).join('<br>')}</div><div class="between" style="margin-top:12px"><span class="muted" style="font-size:11px">A recolha só seria possível após reserva validada pela Xmiddle.</span><b>${money(o.total)}</b></div></div>`).join(''):'<div class="empty">Ainda não existem pedidos. Comece por explorar a peixaria.</div>'}</div><div class="notice yellow" style="margin-top:16px">Os locais de levantamento apresentados são fictícios. O protótipo não reserva estações, não emite códigos de levantamento e não movimenta Encomendas de Serviço reais.</div>`}
function showModal(html,wide=''){node('modal').className=`modal ${wide}`.trim();node('modal-content').innerHTML=html;node('overlay').classList.add('open');document.body.style.overflow='hidden';S.modal=true;translateDOM(node('modal'));node('modal').scrollTop=0;const first=node('modal').querySelector('input,button:not([data-action="close-modal"])');if(first)setTimeout(()=>first.focus({preventScroll:true}),30)}
function closeModal(){node('overlay').classList.remove('open');node('modal-content').innerHTML='';document.body.style.overflow='';S.modal=false}
let selectedProduct=null, selectedVariant=null, selectedQty=1;
function productModal(id){const p=getItem(id);if(!p)return;selectedProduct=id;selectedVariant=p.variants[0]?.id;selectedQty=1;const variants=p.variants.map(v=>`<option value="${esc(v.id)}">${esc(v.name[S.lang]||v.name.pt)} · ${money(v.price)}</option>`).join('');showModal(`<img class="modal-photo" src="${esc(p.image)}" alt="${esc(title(p))}" onerror="this.style.opacity=0"><div class="modal-inner"><div class="eyebrow">${p.premium?'Seleção Premium':'Peixaria YFISH'} · ${esc(p.origin)}</div><h2 id="dialog-title" style="font-size:29px;margin:7px 0 6px">${esc(title(p))}</h2><div class="muted" style="font-size:12px;font-style:italic;margin-bottom:16px">${esc(p.scientific)}</div><p style="font-size:13px;color:#506778;line-height:1.7">${esc(p.desc[S.lang]||p.desc.pt)}</p><div class="detail-pair"><span>Origem declarada</span><b>${esc(p.origin)}</b></div><div class="detail-pair"><span>Método</span><b>${esc(tr(p.method))}</b></div><div class="detail-pair"><span>Zona FAO</span><b>${esc(p.zone)}</b></div><div class="detail-pair"><span>Classificação interna</span><b>${esc(p.quality)}</b></div><div class="ticket-fields" style="margin:19px 0"><div><label for="product-variant" class="control-label">Apresentação</label><select id="product-variant" class="select">${variants}</select></div><div><label for="product-qty" class="control-label">Quantidade</label><input id="product-qty" class="input" type="number" min="1" max="99" value="1"></div></div><button class="btn primary full" data-action="add-cart">Adicionar ao cesto ${icon('bag')}</button><p class="risk">A preparação, a cadeia de frio e a entrega são responsabilidades dos parceiros YFISH. A interação com a Xstation é mediada pela Xmiddle, nos termos de autorização aplicáveis.</p></div>`)}
function addCart(){const p=getItem(selectedProduct),v=p?.variants.find(v=>v.id===node('product-variant')?.value),qty=Number(node('product-qty')?.value);if(!v||!Number.isInteger(qty)||qty<1||qty>99)return toast('Indique uma quantidade válida (1 a 99).');const old=S.cart.find(i=>i.productId===p.id&&i.variantId===v.id);if(old)old.qty=Math.min(old.qty+qty,99);else S.cart.push({productId:p.id,variantId:v.id,qty});persist();closeModal();renderActive(false);toast('Produto adicionado ao cesto.')}
function cartTotal(){return S.cart.reduce((sum,it)=>{const v=getItem(it.productId)?.variants.find(v=>v.id===it.variantId);return sum+(v?.price||0)*it.qty},0)}
function cartModal(){showModal(`<div class="modal-head"><div class="eyebrow">YFISH · Peixaria</div><h2 id="dialog-title">O meu cesto</h2></div><div class="modal-body">${S.cart.length?S.cart.map((it,i)=>{const p=getItem(it.productId),v=p?.variants.find(v=>v.id===it.variantId);return `<div class="cart-line"><img src="${esc(p?.image)}" alt="" onerror="this.style.opacity=0"><div><b>${esc(title(p))}</b><div class="muted" style="font-size:11px">${esc(v?.name?.[S.lang]||v?.name?.pt)} · ${money(v?.price)}</div><div class="row" style="gap:7px;margin-top:5px"><button class="btn ghost sm" data-cart-adjust="${i}" data-delta="-1">−</button><b>${it.qty}</b><button class="btn ghost sm" data-cart-adjust="${i}" data-delta="1">+</button></div></div><div style="text-align:right"><b>${money((v?.price||0)*it.qty)}</b><button class="btn ghost sm" style="display:block;color:#bc5555;margin-top:6px" data-cart-remove="${i}">Remover</button></div></div>`}).join('')+`<div class="between" style="margin:18px 0"><b>Total estimado</b><b style="font-size:23px">${money(cartTotal())}</b></div><button class="btn primary full" data-action="checkout">Preparar encomenda ${icon('arrow')}</button>`:'<div class="empty">O cesto está vazio.</div><button class="btn outline full" data-action="close-modal">Continuar a comprar</button>'}</div>`)}
function checkoutModal(){if(!S.cart.length)return toast('O cesto está vazio.');showModal(`<div class="modal-head"><div class="eyebrow">Passo final · Demonstração</div><h2 id="dialog-title">Preparar encomenda</h2></div><div class="modal-body"><div class="notice">Os locais abaixo são exemplos fictícios de Xstation. Não existe disponibilidade validada ou reserva real.</div><label class="control-label" for="checkout-station" style="margin-top:19px">Xstation para levantamento</label><select class="select" id="checkout-station">${STATIONS.map(s=>`<option>${esc(s)}</option>`).join('')}</select><div class="detail-pair" style="margin-top:14px"><span>Itens</span><b>${S.cart.reduce((a,b)=>a+b.qty,0)}</b></div><div class="detail-pair"><span>Embalagem</span><b>PACK reutilizável (conceptual)</b></div><div class="detail-pair"><span>Total estimado</span><b>${money(cartTotal())}</b></div><div class="notice yellow" style="margin:18px 0">Nenhum pagamento, reserva, código de acesso ou transporte será executado. O pedido fica guardado neste dispositivo.</div><button class="btn primary full" data-action="confirm-order">Registar pedido de demonstração</button></div>`)}
function confirmOrder(){if(!S.cart.length)return;const station=node('checkout-station')?.value||STATIONS[0];const items=S.cart.map(it=>{const p=getItem(it.productId),v=p?.variants.find(v=>v.id===it.variantId);return {name:title(p),variant:v?.name.pt,qty:it.qty,unitPrice:v?.price}});S.orders.unshift({id:`YF-${String(Date.now()).slice(-7)}`,at:Date.now(),station,items,total:cartTotal()});S.cart=[];persist();closeModal();navTo('pedidos');toast('Pedido de demonstração registado.')}
function resetMarket(){if(!confirm('Repor saldo, posições e histórico do mercado simulado? Os pedidos e leilões não serão apagados.'))return;S.cash=25000;S.positions=[];S.pending=[];S.history=[];S.realized=0;persist();renderActive(true);toast('Carteira de simulação reposta.')}
function updateTicketSummary(){const panel=node('ticket-summary');if(!panel)return;const qty=Number(node('trade-qty')?.value),limit=Number(node('trade-limit')?.value),unit=S.tradeType==='limit'&&Number.isFinite(limit)&&limit>0?limit:q(S.instrument).price,notional=qty*unit*10;panel.innerHTML=`<div class="summary-line"><span>Exposição nominal</span><b>${qty>0?money(notional):'—'}</b></div><div class="summary-line"><span>Margem inicial (25%)</span><b>${qty>0?money(notional*.25):'—'}</b></div><div class="summary-line"><span>Multiplicador</span><b>10 kg / contrato</b></div><div class="summary-line"><span>Vencimento</span><b>31 mar 2027</b></div>`}
function handleAction(button){const action=button.dataset.action;if(action==='close-modal')return closeModal();if(action==='back')return goBack();if(action==='cart')return cartModal();if(action==='mobile-more')return showModal(`<div class="modal-head"><div class="eyebrow">YFISH</div><h2 id="dialog-title">Explorar a plataforma</h2></div><div class="modal-body stack">${[NAV[3],NAV[5],NAV[6],NAV[7]].map(([id,label,ic])=>`<button class="btn outline full" data-nav="${id}" style="justify-content:flex-start;padding:15px">${icon(ic)} ${label} ${icon('arrow')}</button>`).join('')}</div>`);if(action==='add-cart')return addCart();if(action==='checkout')return checkoutModal();if(action==='confirm-order')return confirmOrder();if(action==='trade')return placeTrade();if(action==='watch'){let id=button.dataset.id;S.watchlist=S.watchlist.includes(id)?S.watchlist.filter(x=>x!==id):[...S.watchlist,id];persist();renderActive(false);return toast(S.watchlist.includes(id)?'Adicionado à lista de observação.':'Removido da lista de observação.')}if(action==='membership'){S.membership=!S.membership;persist();renderActive(true);return toast(S.membership?'Maré+ de demonstração ativado.':'Maré+ de demonstração desativado.')}if(action==='export')return exportCSV();if(action==='reset-market')return resetMarket();if(action==='restart-auctions'){if(!confirm('Reiniciar os quatro leilões de demonstração? Os lances locais anteriores serão apagados.'))return;S.auction={};persist();renderActive(true);return toast('Novas sessões de demonstração iniciadas.')}}
function handleClick(e){const t=e.target.closest('[data-lang],[data-nav],[data-action],[data-category],[data-product],[data-contract],[data-story],[data-side],[data-period],[data-news-filter],[data-scenario],[data-bid-open],[data-submit-bid],[data-close-position],[data-cancel-order],[data-cart-adjust],[data-cart-remove],[data-story-contract]');if(!t)return;const d=t.dataset;if(d.lang){changeLang(d.lang);return}if(d.nav){e.preventDefault();closeModal();navTo(d.nav);return}if(d.action){handleAction(t);return}if(d.category){S.cat=d.category;renderActive(true);return}if(d.product){productModal(d.product);return}if(d.contract){S.instrument=d.contract;S.chartHover=-1;navTo('bolsa');return}if(d.story){articleModal(d.story);return}if(d.side){S.tradeSide=d.side;S.tradeLimit=node('trade-limit')?.value||S.tradeLimit;renderActive(false);return}if(d.period){S.period=d.period;S.chartHover=-1;renderActive(false);return}if(d.newsFilter){S.newsFilter=d.newsFilter;renderActive(true);return}if(d.scenario){S.scenario=d.scenario;renderActive(true);return}if(d.bidOpen){bidModal(d.bidOpen);return}if(d.submitBid){submitBid(d.submitBid);return}if(d.closePosition){closePosition(d.closePosition);return}if(d.cancelOrder){S.pending=S.pending.filter(p=>p.uid!==d.cancelOrder);persist();renderActive(true);toast('Ordem limitada cancelada.');return}if(d.cartAdjust!==undefined){const index=Number(d.cartAdjust),item=S.cart[index];if(item){item.qty=Math.min(99,item.qty+Number(d.delta));if(item.qty<=0)S.cart.splice(index,1);persist();renderActive(false);cartModal()}return}if(d.cartRemove!==undefined){S.cart.splice(Number(d.cartRemove),1);persist();renderActive(false);cartModal();return}if(d.storyContract){closeModal();S.instrument=d.storyContract;navTo('bolsa');return}}
function handleInput(e){const t=e.target;if(t.id==='trade-qty'){S.tradeQty=Number(t.value);updateTicketSummary()}if(t.id==='trade-limit'){S.tradeLimit=t.value;updateTicketSummary()}if(t.id==='shop-search'){S.shopSearch=t.value;const pos=t.selectionStart;node('page-peixaria').innerHTML=renderShop();const repl=node('shop-search');repl.focus({preventScroll:true});if(pos!==null)repl.setSelectionRange(pos,pos)}if(t.id==='global-search'){S.shopSearch=t.value;S.cat='all';if(S.nav!=='peixaria')navTo('peixaria');else renderActive(true)}}
function handleChange(e){const t=e.target;if(t.id==='trade-type'){S.tradeType=t.value;if(!S.tradeLimit)S.tradeLimit=q(S.instrument).price.toFixed(2);renderActive(false)}}
function updateClock(){document.querySelectorAll('[data-auction-clock]').forEach(el=>{const p=getItem(el.dataset.auctionClock);if(p)el.textContent=timeLeft(lotState(p).ends-Date.now())})}
function boot(){document.addEventListener('click',handleClick);window.addEventListener('popstate',()=>{if(S.modal)closeModal();const route=location.hash.slice(1);if(NAV.some(n=>n[0]===route)){S.nav=route;renderActive(true)}else {S.nav='inicio';renderActive(true)}});document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);node('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();node('global-search').focus()}});window.addEventListener('resize',()=>{if(S.nav==='bolsa')drawChart();if(S.nav==='inicio')renderSparks()},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.nav==='bolsa')drawChart();updateClock()}});const hash=location.hash.slice(1);if(NAV.some(n=>n[0]===hash))S.nav=hash;renderActive(true);setInterval(()=>{if(document.hidden)return;tick();if(++ticks%3===0)persist()},5000);setInterval(updateClock,1000)}
let ticks=0;
// Storage of the simulated quote path keeps opened demo positions coherent after refresh.
if(saved.quotes&&typeof saved.quotes==='object'){for(const c of CONTRACTS){const prev=saved.quotes[c.id];if(prev&&Array.isArray(prev.series)&&prev.series.length>40&&prev.series.every(x=>Number.isFinite(x)&&x>0)){QUOTES[c.id]={price:finite(prev.price,c.base),previous:finite(prev.previous,c.base),series:prev.series.slice(-360),updated:finite(prev.updated,Date.now())}}}}
if(Number.isInteger(saved.seed))rndSeed=saved.seed;
const originalPersist=persist;persist=function(){try{localStorage.setItem(STORAGE,JSON.stringify({cart:S.cart,orders:S.orders,auction:S.auction,membership:S.membership,watchlist:S.watchlist,positions:S.positions,pending:S.pending,history:S.history,cash:S.cash,realized:S.realized,seed:rndSeed,quotes:QUOTES}))}catch(e){console.warn('Armazenamento indisponível',e)}};
boot();
