 {id:'fukushima',type:'Documentários',date:'11 mar 2011',source:'AIEA / IAEA',url:'https://gnssn.iaea.org/FukushimaLessonsLearned/SitePages/default.aspx',title:'Fukushima: o tsunami que mudou o litoral japonês',deck:'O sismo e tsunami de 2011, o acidente nuclear e as questões sobre comunidades costeiras e segurança alimentar.',body:['Em 11 de março de 2011, um sismo de grande magnitude provocou um tsunami que atingiu o nordeste do Japão. A central de Fukushima Daiichi sofreu falhas graves de alimentação e arrefecimento, desencadeando um acidente nuclear.','Este dossiê histórico aborda o desastre e o seu contexto, sem reduzir os efeitos ambientais a afirmações simplistas sobre todos os produtos do mar. O acompanhamento dos efeitos, a fiscalização e as regras de segurança devem apoiar-se em fontes científicas e regulatórias.','Conteúdo editorial escrito para este protótipo, não é um vídeo alojado nem uma produção audiovisual original. O botão de fonte permite aprofundar a investigação da AIEA.'],asset:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1100&q=80',contracts:[]},

ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e9eef2';ctx.lineWidth=1;ctx.fillStyle='#92a1ac';ctx.font='11px DM Sans, system-ui';for(let i=0;i<=4;i++){let yp=T+i*plotH/4;ctx.beginPath();ctx.moveTo(L,yp);ctx.lineTo(w-R,yp);ctx.stroke();ctx.textAlign='right';ctx.fillText((max-i*(max-min)/4).toFixed(2).replace('.',','),L-9,yp+4)}ctx.textAlign='center';['−'+(n===35?'45 min':n===100?'1 dia':n===180?'1 sem':'1 mês'),'−'+(n===35?'20 min':n===100?'12 h':n===180?'3 dias':'15 dias'),'Agora'].forEach((s,i)=>ctx.fillText(s,L+i*plotW/2,h-8));const positive=series.at(-1)>=series[0];ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.lineTo(x(series.length-1),T+plotH);ctx.lineTo(L,T+plotH);ctx.closePath();const gradient=ctx.createLinearGradient(0,T,0,T+plotH);gradient.addColorStop(0,positive?'rgba(13,160,128,.16)':'rgba(221,88,84,.13)');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle=positive?'#0c9b7b':'#dd6666';ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();const last=series.at(-1);ctx.beginPath();ctx.arc(x(series.length-1),y(last),4,0,Math.PI*2);ctx.fillStyle=positive?'#0c9b7b':'#dd6666';ctx.fill();canvas._chart={series,L,R,T,B,plotW,plotH,min,max,x,y};

function bindChart(){const c=node('price-chart');if(!c||c.dataset.bound)return;c.dataset.bound='1';c.addEventListener('pointermove',event=>{const r=c.getBoundingClientRect(),data=c._chart;if(!data)return;let i=Math.round((event.clientX-r.left-data.L)/data.plotW*(data.series.length-1));S.chartHover=Math.max(0,Math.min(data.series.length-1,i));const tip=node('chart-tooltip');if(tip){tip.style.display='block';tip.style.left=Math.min(Math.max(event.clientX-r.left+9,10),r.width-112)+'px';tip.style.top=Math.max(3,data.y(data.series[S.chartHover])-45)+'px';tip.textContent=money(data.series[S.chartHover])+' / kg'}drawChart()});c.addEventListener('pointerleave',()=>{S.chartHover=-1;const tip=node('chart-tooltip');if(tip)tip.style.display='none';drawChart()})}
function renderPortfolio(){const unreal=floatingPL(),positions=S.positions;return `${header('Carteira','Acompanhe posições, margem e histórico das operações virtuais.',`<button class="btn outline sm" data-action="export">${icon('download')} Exportar CSV</button>`)}<div class="portfolio-kpi"><div class="stat"><div class="eyebrow">Património virtual</div><div class="headline-stat">${money(equity())}</div><div class="submetric">Saldo + margem + resultados</div></div><div class="stat"><div class="eyebrow">Disponível</div><div class="headline-stat">${money(S.cash)}</div><div class="submetric">Para novas posições</div></div><div class="stat"><div class="eyebrow">Resultado total</div><div class="headline-stat ${moveClass(S.realized+unreal)}">${signMoney(S.realized+unreal)}</div><div class="submetric">Realizado + não realizado</div></div></div><div class="panel" style="margin-bottom:17px"><div class="section-head"><h2>Posições abertas</h2><span class="pill">${positions.length} posições</span></div>${positions.length?`<div class="scroll-table"><table class="position-table"><thead><tr><th>Contrato</th><th>Direção</th><th class="right">Qtd.</th><th class="right">Entrada</th><th class="right">Atual</th><th class="right">Resultado</th><th class="right"></th></tr></thead><tbody>${positions.map(p=>`<tr><td><b>${esc(contract(p.id)?.name)}</b><div class="contract-detail">${p.id}-F27 · 10 kg</div></td><td><span class="pill ${p.side==='long'?'green':'red'}">${p.side==='long'?'Long':'Short'}</span></td><td class="right">${p.qty}</td><td class="right">${money(p.entry)}</td><td class="right">${money(q(p.id).price)}</td><td class="right ${moveClass(positionPL(p))}"><b>${signMoney(positionPL(p))}</b></td><td class="right"><button class="btn outline sm" data-close-position="${p.uid}">Fechar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ainda não tem posições. Abra uma ordem simulada na Bolsa do Mar.</div>'}</div>
<div class="panel" style="margin-bottom:17px"><div class="section-head"><h2>Ordens pendentes</h2><span class="pill">${S.pending.length}</span></div>${S.pending.length?`<div class="scroll-table"><table class="position-table"><thead><tr><th>Produto</th><th>Operação</th><th class="right">Qtd.</th><th class="right">Limite</th><th class="right"></th></tr></thead><tbody>${S.pending.map(p=>`<tr><td>${esc(contract(p.id)?.name)}</td><td>${p.side==='long'?'Compra':'Venda'}</td><td class="right">${p.qty}</td><td class="right">${money(p.limit)}</td><td class="right"><button class="btn outline sm" data-cancel-order="${p.uid}">Cancelar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Não existem ordens limitadas pendentes.</div>'}</div>
<div class="panel"><div class="orders-bar"><h2>Atividade recente</h2><button class="btn ghost sm" data-action="reset-market">Repor simulação</button></div>${S.history.length?S.history.slice(0,12).map(h=>`<div class="between" style="padding:12px 0;border-top:1px solid var(--line);font-size:12px"><div><b>${esc(h.label)}</b><div class="muted" style="font-size:10px">${fmtDate.format(new Date(h.at))}</div></div><b class="${moveClass(h.pnl||0)}">${h.pnl===undefined?money(h.value||0):signMoney(h.pnl)}</b></div>`).join(''):'<div class="empty">Os movimentos surgirão aqui.</div>'}</div>`}
function placeTrade(){const qty=Number(node('trade-qty')?.value||S.tradeQty),limit=Number(node('trade-limit')?.value),c=contract(S.instrument),side=S.tradeSide==='buy'?'long':'short';if(!Number.isInteger(qty)||qty<1||qty>100)return toast('Indique entre 1 e 100 contratos.');if(S.tradeType==='limit'){if(!Number.isFinite(limit)||limit<=0)return toast('Introduza um preço limite válido.');S.pending.unshift({uid:uid('ord'),id:c.id,side,qty,limit,at:Date.now()});persist();toast('Ordem limitada registada na simulação.');renderActive(false);return}openPosition(c.id,side,qty,q(c.id).price,true)}
function openPosition(id,side,qty,price,showToast=false){const required=price*qty*10*.25;if(required>S.cash+1e-8){if(showToast)toast('Saldo virtual insuficiente para a margem inicial.');return false}S.cash=Math.round((S.cash-required)*100)/100;S.positions.unshift({uid:uid('pos'),id,side,qty,entry:price,margin:required,at:Date.now()});S.history.unshift({label:`${side==='long'?'Long':'Short'} · ${contract(id)?.name} × ${qty}`,value:required,at:Date.now()});persist();if(showToast)toast('Posição aberta na carteira de simulação.');renderActive(false);return true}
function closePosition(uid0,forced=false){const idx=S.positions.findIndex(p=>p.uid===uid0);if(idx<0)return;const p=S.positions.splice(idx,1)[0],pnl=Math.round(positionPL(p)*100)/100;S.cash=Math.round((S.cash+p.margin+pnl)*100)/100;S.realized+=pnl;S.history.unshift({label:`${forced?'Liquidação automática':'Fecho'} · ${contract(p.id)?.name} × ${p.qty}`,pnl,at:Date.now()});persist();toast(forced?'Posição liquidada por controlo de risco.':`Posição fechada: ${signMoney(pnl)}.`);renderActive(false)}
function matchPending(){let changed=false;S.pending=S.pending.filter(p=>{const value=q(p.id)?.price;if(!value)return true;const matches=p.side==='long'?value<=p.limit:value>=p.limit;if(matches){if(openPositionSilent(p,value)){changed=true;return false}}return true});if(changed){persist();toast('Uma ordem limitada foi executada.')} // Demo maintenance margin: automatic liquidation at 50% of initial total margin.
let guard=0;while(S.positions.length&&equity()<usedMargin()*.5&&guard++<20){const p=S.positions[0];S.positions.shift();const pnl=positionPL(p);S.cash=Math.round((S.cash+p.margin+pnl)*100)/100;S.realized+=pnl;S.history.unshift({label:`Liquidação por margem · ${contract(p.id)?.name}`,pnl,at:Date.now()});changed=true}if(changed)persist();}
function openPositionSilent(p,price){const margin=price*p.qty*10*.25;if(margin>S.cash)return false;S.cash=Math.round((S.cash-margin)*100)/100;S.positions.unshift({uid:uid('pos'),id:p.id,side:p.side,qty:p.qty,entry:price,margin,at:Date.now()});S.history.unshift({label:`Ordem limitada executada · ${contract(p.id)?.name}`,value:margin,at:Date.now()});return true}
function uid(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.floor(random()*1e7).toString(36)}`}
function exportCSV(){const rows=[['ID','Produto','Direção','Quantidade','Preço de entrada','Preço atual','Margem','Resultado não realizado'],...S.positions.map(p=>[p.uid,contract(p.id)?.name,p.side,p.qty,p.entry,q(p.id).price,p.margin,positionPL(p)])];const content='\ufeff'+rows.map(row=>row.map(s=>'"'+String(s??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='YFISH_carteira_simulada.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function closeModal(){node('overlay').classList.remove('open');node('modal-content').innerHTML='';document.body.style.overflow='';S.modal=false}
let selectedProduct=null, selectedVariant=null, selectedQty=1;
function productModal(id){const p=getItem(id);if(!p)return;selectedProduct=id;selectedVariant=p.variants[0]?.id;selectedQty=1;const variants=p.variants.map(v=>`<option value="${esc(v.id)}">${esc(v.name.pt)} · ${money(v.price)}</option>`).join('');showModal(`<img class="modal-photo" src="${esc(p.image)}" alt="${esc(title(p))}" onerror="this.style.opacity=0"><div class="modal-inner"><div class="eyebrow">${p.premium?'Seleção Premium':'Peixaria YFISH'} · ${esc(p.origin)}</div><h2 id="dialog-title" style="font-size:29px;margin:7px 0 6px">${esc(title(p))}</h2><div class="muted" style="font-size:12px;font-style:italic;margin-bottom:16px">${esc(p.scientific)}</div><p style="font-size:13px;color:#506778;line-height:1.7">${esc(p.desc.pt)}</p><div class="detail-pair"><span>Origem declarada</span><b>${esc(p.origin)}</b></div><div class="detail-pair"><span>Método</span><b>${esc(p.method)}</b></div><div class="detail-pair"><span>Zona FAO</span><b>${esc(p.zone)}</b></div><div class="detail-pair"><span>Classificação interna</span><b>${esc(p.quality)}</b></div><div class="ticket-fields" style="margin:19px 0"><div><label for="product-variant" class="control-label">Apresentação</label><select id="product-variant" class="select">${variants}</select></div><div><label for="product-qty" class="control-label">Quantidade</label><input id="product-qty" class="input" type="number" min="1" max="99" value="1"></div></div><button class="btn primary full" data-action="add-cart">Adicionar ao cesto ${icon('bag')}</button><p class="risk">A preparação, a cadeia de frio e a entrega são responsabilidades dos parceiros YFISH. A interação com a Xstation é mediada pela Xmiddle, nos termos de autorização aplicáveis.</p></div>`)}
function addCart(){const p=getItem(selectedProduct),v=p?.variants.find(v=>v.id===node('product-variant')?.value),qty=Number(node('product-qty')?.value);if(!v||!Number.isInteger(qty)||qty<1||qty>99)return toast('Indique uma quantidade válida (1 a 99).');const old=S.cart.find(i=>i.productId===p.id&&i.variantId===v.id);if(old)old.qty=Math.min(old.qty+qty,99);else S.cart.push({productId:p.id,variantId:v.id,qty});persist();closeModal();renderActive(false);toast('Produto adicionado ao cesto.')}
function cartTotal(){return S.cart.reduce((sum,it)=>{const v=getItem(it.productId)?.variants.find(v=>v.id===it.variantId);return sum+(v?.price||0)*it.qty},0)}
function cartModal(){showModal(`<div class="modal-head"><div class="eyebrow">YFISH · Peixaria</div><h2 id="dialog-title">O meu cesto</h2></div><div class="modal-body">${S.cart.length?S.cart.map((it,i)=>{const p=getItem(it.productId),v=p?.variants.find(v=>v.id===it.variantId);return `<div class="cart-line"><img src="${esc(p?.image)}" alt="" onerror="this.style.opacity=0"><div><b>${esc(title(p))}</b><div class="muted" style="font-size:11px">${esc(v?.name.pt)} · ${money(v?.price)}</div><div class="row" style="gap:7px;margin-top:5px"><button class="btn ghost sm" data-cart-adjust="${i}" data-delta="-1">−</button><b>${it.qty}</b><button class="btn ghost sm" data-cart-adjust="${i}" data-delta="1">+</button></div></div><div style="text-align:right"><b>${money((v?.price||0)*it.qty)}</b><button class="btn ghost sm" style="display:block;color:#bc5555;margin-top:6px" data-cart-remove="${i}">Remover</button></div></div>`}).join('')+`<div class="between" style="margin:18px 0"><b>Total estimado</b><b style="font-size:23px">${money(cartTotal())}</b></div><button class="btn primary full" data-action="checkout">Preparar encomenda ${icon('arrow')}</button>`:'<div class="empty">O cesto está vazio.</div><button class="btn outline full" data-action="close-modal">Continuar a comprar</button>'}</div>`)}
function checkoutModal(){if(!S.cart.length)return toast('O cesto está vazio.');showModal(`<div class="modal-head"><div class="eyebrow">Passo final · Demonstração</div><h2 id="dialog-title">Preparar encomenda</h2></div><div class="modal-body"><div class="notice">Os locais abaixo são exemplos fictícios de Xstation. Não existe disponibilidade validada ou reserva real.</div><label class="control-label" for="checkout-station" style="margin-top:19px">Xstation para levantamento</label><select class="select" id="checkout-station">${STATIONS.map(s=>`<option>${esc(s)}</option>`).join('')}</select><div class="detail-pair" style="margin-top:14px"><span>Itens</span><b>${S.cart.reduce((a,b)=>a+b.qty,0)}</b></div><div class="detail-pair"><span>Embalagem</span><b>PACK reutilizável (conceptual)</b></div><div class="detail-pair"><span>Total estimado</span><b>${money(cartTotal())}</b></div><div class="notice yellow" style="margin:18px 0">Nenhum pagamento, reserva, código de acesso ou transporte será executado. O pedido fica guardado neste dispositivo.</div><button class="btn primary full" data-action="confirm-order">Registar pedido de demonstração</button></div>`)}
function confirmOrder(){if(!S.cart.length)return;const station=node('checkout-station')?.value||STATIONS[0];const items=S.cart.map(it=>{const p=getItem(it.productId),v=p?.variants.find(v=>v.id===it.variantId);return {name:title(p),variant:v?.name.pt,qty:it.qty,unitPrice:v?.price}});S.orders.unshift({id:`YF-${String(Date.now()).slice(-7)}`,at:Date.now(),station,items,total:cartTotal()});S.cart=[];persist();closeModal();navTo('pedidos');toast('Pedido de demonstração registado.')}
function resetMarket(){if(!confirm('Repor saldo, posições e histórico do mercado simulado? Os pedidos e leilões não serão apagados.'))return;S.cash=25000;S.positions=[];S.pending=[];S.history=[];S.realized=0;persist();renderActive(true);toast('Carteira de simulação reposta.')}
function updateTicketSummary(){const panel=node('ticket-summary');if(!panel)return;const qty=Number(node('trade-qty')?.value),limit=Number(node('trade-limit')?.value),unit=S.tradeType==='limit'&&Number.isFinite(limit)&&limit>0?limit:q(S.instrument).price,notional=qty*unit*10;panel.innerHTML=`<div class="summary-line"><span>Exposição nominal</span><b>${qty>0?money(notional):'—'}</b></div><div class="summary-line"><span>Margem inicial (25%)</span><b>${qty>0?money(notional*.25):'—'}</b></div><div class="summary-line"><span>Multiplicador</span><b>10 kg / contrato</b></div><div class="summary-line"><span>Vencimento</span><b>31 mar 2027</b></div>`}
function handleAction(button){const action=button.dataset.action;if(action==='close-modal')return closeModal();if(action==='cart')return cartModal();if(action==='mobile-more')return showModal(`<div class="modal-head"><div class="eyebrow">YFISH</div><h2 id="dialog-title">Explorar a plataforma</h2></div><div class="modal-body stack">${[NAV[3],NAV[5],NAV[6],NAV[7]].map(([id,label,ic])=>`<button class="btn outline full" data-nav="${id}" style="justify-content:flex-start;padding:15px">${icon(ic)} ${label} ${icon('arrow')}</button>`).join('')}</div>`);if(action==='add-cart')return addCart();if(action==='checkout')return checkoutModal();if(action==='confirm-order')return confirmOrder();if(action==='trade')return placeTrade();if(action==='watch'){let id=button.dataset.id;S.watchlist=S.watchlist.includes(id)?S.watchlist.filter(x=>x!==id):[...S.watchlist,id];persist();renderActive(false);return toast(S.watchlist.includes(id)?'Adicionado à lista de observação.':'Removido da lista de observação.')}if(action==='membership'){S.membership=!S.membership;persist();renderActive(true);return toast(S.membership?'Maré+ de demonstração ativado.':'Maré+ de demonstração desativado.')}if(action==='export')return exportCSV();if(action==='reset-market')return resetMarket();if(action==='restart-auctions'){if(!confirm('Reiniciar os quatro leilões de demonstração? Os lances locais anteriores serão apagados.'))return;S.auction={};persist();renderActive(true);return toast('Novas sessões de demonstração iniciadas.')}}
function handleClick(e){const t=e.target.closest('[data-nav],[data-action],[data-category],[data-product],[data-contract],[data-story],[data-side],[data-period],[data-news-filter],[data-scenario],[data-bid-open],[data-submit-bid],[data-close-position],[data-cancel-order],[data-cart-adjust],[data-cart-remove],[data-story-contract]');if(!t)return;const d=t.dataset;if(d.nav){e.preventDefault();closeModal();navTo(d.nav);return}if(d.action){handleAction(t);return}if(d.category){S.cat=d.category;renderActive(true);return}if(d.product){productModal(d.product);return}if(d.contract){S.instrument=d.contract;S.chartHover=-1;navTo('bolsa');return}if(d.story){articleModal(d.story);return}if(d.side){S.tradeSide=d.side;S.tradeLimit=node('trade-limit')?.value||S.tradeLimit;renderActive(false);return}if(d.period){S.period=d.period;S.chartHover=-1;renderActive(false);return}if(d.newsFilter){S.newsFilter=d.newsFilter;renderActive(true);return}if(d.scenario){S.scenario=d.scenario;renderActive(true);return}if(d.bidOpen){bidModal(d.bidOpen);return}if(d.submitBid){submitBid(d.submitBid);return}if(d.closePosition){closePosition(d.closePosition);return}if(d.cancelOrder){S.pending=S.pending.filter(p=>p.uid!==d.cancelOrder);persist();renderActive(true);toast('Ordem limitada cancelada.');return}if(d.cartAdjust!==undefined){const index=Number(d.cartAdjust),item=S.cart[index];if(item){item.qty=Math.min(99,item.qty+Number(d.delta));if(item.qty<=0)S.cart.splice(index,1);persist();renderActive(false);cartModal()}return}if(d.cartRemove!==undefined){S.cart.splice(Number(d.cartRemove),1);persist();renderActive(false);cartModal();return}if(d.storyContract){closeModal();S.instrument=d.storyContract;navTo('bolsa');return}}
function handleInput(e){const t=e.target;if(t.id==='trade-qty'){S.tradeQty=Number(t.value);updateTicketSummary()}if(t.id==='trade-limit'){S.tradeLimit=t.value;updateTicketSummary()}if(t.id==='shop-search'){S.shopSearch=t.value;const pos=t.selectionStart;node('page-peixaria').innerHTML=renderShop();const repl=node('shop-search');repl.focus({preventScroll:true});if(pos!==null)repl.setSelectionRange(pos,pos)}if(t.id==='global-search'){S.shopSearch=t.value;S.cat='all';if(S.nav!=='peixaria')navTo('peixaria');else renderActive(true)}}
function handleChange(e){const t=e.target;if(t.id==='trade-type'){S.tradeType=t.value;if(!S.tradeLimit)S.tradeLimit=q(S.instrument).price.toFixed(2);renderActive(false)}}
function updateClock(){document.querySelectorAll('[data-auction-clock]').forEach(el=>{const p=getItem(el.dataset.auctionClock);if(p)el.textContent=timeLeft(lotState(p).ends-Date.now())})}
function boot(){document.addEventListener('click',handleClick);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);node('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();node('global-search').focus()}});window.addEventListener('resize',()=>{if(S.nav==='bolsa')drawChart();if(S.nav==='inicio')renderSparks()},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.nav==='bolsa')drawChart();updateClock()}});const hash=location.hash.slice(1);if(NAV.some(n=>n[0]===hash))S.nav=hash;renderActive(true);setInterval(()=>{if(document.hidden)return;tick();if(++ticks%3===0)persist()},5000);setInterval(updateClock,1000)}
let ticks=0;
// Storage of the simulated quote path keeps opened demo positions coherent after refresh.
if(saved.quotes&&typeof saved.quotes==='object'){for(const c of CONTRACTS){const prev=saved.quotes[c.id];if(prev&&Array.isArray(prev.series)&&prev.series.length>40&&prev.series.every(x=>Number.isFinite(x)&&x>0)){QUOTES[c.id]={price:finite(prev.price,c.base),previous:finite(prev.previous,c.base),series:prev.series.slice(-360),updated:finite(prev.updated,Date.now())}}}}
if(Number.isInteger(saved.seed))rndSeed=saved.seed;
const originalPersist=persist;persist=function(){try{localStorage.setItem(STORAGE,JSON.stringify({cart:S.cart,orders:S.orders,auction:S.auction,membership:S.membership,watchlist:S.watchlist,positions:S.positions,pending:S.pending,history:S.history,cash:S.cash,realized:S.realized,seed:rndSeed,quotes:QUOTES}))}catch(e){console.warn('Armazenamento indisponível',e)}};
boot();
</script></body></html>
