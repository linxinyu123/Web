 {id:'charles',type:'Atualidade',date:'10 nov 2026',source:'DGRM',url:'https://www.dgrm.pt/destaques?articleId=926918',title:'Depressão Charles: aviso marítimo para a pesca',deck:'O aviso da DGRM explica quando e porquê adiar as saídas para o mar nas zonas afetadas.',body:['A Direção-Geral de Recursos Naturais, Segurança e Serviços Marítimos publicou em 10 de novembro de 2026 um aviso sobre a depressão Charles. Segundo esse aviso, o estado do mar deveria agravar-se entre o final de 10 e o meio-dia de 12 de novembro.','A autoridade recomendou aos profissionais da pesca e da náutica de recreio que adiassem as saídas nas zonas afetadas enquanto persistissem as condições adversas.','Leitura de mercado: menos saídas podem diminuir temporariamente a oferta de pescado fresco. O efeito concreto nas descargas e nos preços não foi quantificado pela fonte citada; qualquer projeção desse impacto é apenas um cenário.'],asset:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=80',contracts:['SRD','CRP','RBL'],featured:true},
 {id:'elnino',type:'Mercados',date:'23 jul 2026',source:'FAO / GLOBEFISH',url:'https://www.fao.org/in-action/globefish/news-events/news/news-detail/china-demand-and-lower-quotas-lift-fishmeal-and-fish-oil-prices/en',title:'Anchovas, El Niño e a pressão sobre a farinha de peixe',deck:'Quotas reduzidas e risco climático criaram tensões na oferta de farinha e óleo de peixe em 2026.',body:['A FAO/GLOBEFISH descreveu uma redução das quotas de anchova no Peru e no Chile, juntamente com risco crescente associado ao El Niño. Esses fatores contribuíram para um mercado internacional de farinha e óleo de peixe mais apertado.','A mesma análise indicou que a farinha de peixe super prime, FOB Peru, passou de cerca de 1 400 USD/t um ano antes para 2 500 USD/t em maio de 2026. Este valor refere-se a farinha de peixe, não ao preço de retalho de anchova fresca.','A eventual substituição da farinha de peixe por ingredientes de soja em rações é uma hipótese económica relevante; não é correto afirmar, sem dados adicionais, que o El Niño tenha por si só causado um aumento da produção mundial de soja.'],asset:'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=900&q=80',contracts:['ANC','SRD']},
 {id:'chain',type:'Análise',date:'Cenário YFISH',source:'Laboratório YFISH',url:'',title:'Da lota à Xstation: como proteger a cadeia de frio',deck:'Um exercício sobre embalagem reutilizável, acondicionamento, rastreabilidade e levantamento.',body:['No modelo YFISH, o peixe é preparado por parceiros, acondicionado em PACK compatível e registado como Encomenda de Serviço para levantamento em Xstation, quando autorizado.','O UoD do eXange não garante, por si só, refrigeração das Xstation. A preservação da cadeia de frio exigiria validação operacional e, se necessário, capacidade adicional explicitamente especificada.','A plataforma mantém os seus próprios dados de lote, origem, qualidade declarada e cliente. A interação com a Xstation é intermediada pela Xmiddle, sem comandos diretos.'],asset:'https://images.unsplash.com/photo-1535399831218-d5bd36d1a6b3?auto=format&fit=crop&w=900&q=80',contracts:['PSS','ATM']},
 {id:'fukushima',type:'Documentários',date:'11 mar 2011',source:'AIEA / IAEA',url:'https://gnssn.iaea.org/FukushimaLessonsLearned/SitePages/default.aspx',title:'Fukushima: o tsunami que mudou o litoral japonês',deck:'O sismo e tsunami de 2011, o acidente nuclear e as questões sobre comunidades costeiras e segurança alimentar.',body:['Em 11 de março de 2011, um sismo de grande magnitude provocou um tsunami que atingiu o nordeste do Japão. A central de Fukushima Daiichi sofreu falhas graves de alimentação e arrefecimento, desencadeando um acidente nuclear.','Este dossiê histórico aborda o desastre e o seu contexto, sem reduzir os efeitos ambientais a afirmações simplistas sobre todos os produtos do mar. O acompanhamento dos efeitos, a fiscalização e as regras de segurança devem apoiar-se em fontes científicas e regulatórias.','Conteúdo editorial escrito para este protótipo, não é um vídeo alojado nem uma produção audiovisual original. O botão de fonte permite aprofundar a investigação da AIEA.'],asset:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1100&q=80',contracts:[]},
 {id:'boja',type:'Documentários',date:'1434',source:'NOVA FCSH',url:'https://eve.fcsh.unl.pt/pt/pessoas/gil-eanes',title:'Gil Eanes e o Cabo Bojador: vencer a fronteira do Atlântico',deck:'Uma viagem pela navegação portuguesa, pelas rotas do século XV e pelos encontros e conflitos que se seguiram.',body:['Em 1434, Gil Eanes dobrou o Cabo Bojador, na costa ocidental africana, ao serviço do Infante D. Henrique, segundo a historiografia portuguesa.','Este marco costuma ser apresentado como uma etapa da expansão marítima portuguesa. A análise histórica deve considerar também os seus efeitos posteriores, incluindo violência, captura de pessoas e tráfico de escravizados nas viagens de expansão.','Conteúdo editorial histórico de demonstração; não é um documentário audiovisual. A ligação conduz à Enciclopédia Virtual da Expansão Portuguesa, da NOVA FCSH.'],asset:'https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?auto=format&fit=crop&w=1100&q=80',contracts:[]}

const STORY_TRANSLATIONS = {"charles":{"en":{"title":"Storm Charles: fish stocks to the moon?","deck":"Bad weather could reduce fishing trips. Could fish prices rise? We separate verified warnings from market speculation.","body":["On 10 November 2026, Portugal’s Directorate-General for Natural Resources, Safety and Maritime Services (DGRM) published a warning about Storm Charles. It anticipated worsening sea conditions from late 10 November until midday on 12 November.","The authority recommended that fishing crews and recreational sailors in affected areas postpone departures while the adverse conditions lasted.","Market interpretation: fewer fishing trips could temporarily reduce fresh fish supply. The cited notice did not quantify the effects on landings or prices; any estimated effect is a hypothetical scenario."]},"cn":{"title":"查尔斯风暴：鱼价要冲上月球？","deck":"恶劣天气可能使渔船减少出海。鱼价会飙升吗？区分已证实的预警与市场猜测。","body":["2026 年 11 月 10 日，葡萄牙自然资源、安全和海事服务总局（DGRM）发布查尔斯风暴预警，指出从 10 日晚至 12 日中午，部分海域海况可能恶化。","官方建议受影响地区的专业渔民及休闲航海人员，在恶劣天气持续期间推迟出海。","市场解读：减少出海可能暂时减少鲜鱼供应。但这份公告没有统计实际上岸量或价格变化，因此任何价格影响只能作为假设性情景，不是已证实的结果。"]}},"elnino":{"en":{"title":"Anchovies, El Niño and pressure on fishmeal markets","deck":"Reduced quotas and climate risks tightened fishmeal and fish-oil supply in 2026.","body":["FAO/GLOBEFISH described lower anchovy quotas in Peru and Chile alongside growing risks associated with El Niño, contributing to tight fishmeal and fish-oil markets.","Its analysis reported that super-prime fishmeal, FOB Peru, rose from roughly USD 1,400 per tonne a year earlier to USD 2,500 per tonne in May 2026. This is the price of fishmeal, not the retail price of fresh anchovies.","Substituting fishmeal with soy-based feed ingredients is an economically relevant possibility. Without additional data, however, it would be wrong to claim that El Niño alone increased global soybean production."]},"cn":{"title":"鳀鱼、厄尔尼诺与鱼粉市场的价格压力","deck":"捕捞配额削减和气候风险，使 2026 年鱼粉及鱼油供应趋紧。","body":["联合国粮农组织 FAO/GLOBEFISH 指出，秘鲁与智利削减鳀鱼捕捞配额，同时厄尔尼诺相关风险上升，这些因素使国际鱼粉和鱼油市场供应更加紧张。","该分析提到，秘鲁离岸价的超优质鱼粉价格从上一年约 1,400 美元/吨，升至 2026 年 5 月约 2,500 美元/吨。注意：这是鱼粉价格，不是新鲜鳀鱼的零售价格。","动物饲料中用大豆原料替代部分鱼粉是一种合理的经济假设，但缺乏更多数据时，不能断言厄尔尼诺单独导致全球大豆产量上升。"]}},"chain":{"en":{"title":"From fish market to Xstation: protecting the cold chain","deck":"A case study of reusable packaging, conditioning, traceability and pickup.","body":["In the YFISH concept, partner sellers prepare fish, pack it in compatible reusable PACK and register it as a Service Parcel for collection at an Xstation when authorized.","The eXange universe of discourse does not, by itself, guarantee refrigeration in Xstation machines. Maintaining the cold chain would require operational validation and, if needed, an explicitly specified additional capability.","YFISH keeps its own batch, origin, quality and customer data. All interactions with an Xstation are mediated through Xmiddle; it issues no direct station commands."]},"cn":{"title":"从鱼市到 Xstation：如何保护冷链","deck":"探索可重复使用包装、温度保障、溯源与自助取货。","body":["在 YFISH 模型中，合作鱼贩处理海鲜，采用兼容的可重复使用 PACK 包装，在获得授权后将其登记为“服务包裹”，供用户在 Xstation 取货。","eXange 的 UoD 并没有自动保证 Xstation 具备制冷能力。要真正保持冷链，需要运营验证；如果需要额外制冷功能，必须明确提出并说明这一扩展。","YFISH 负责管理自身的批次、产地、申报等级和用户数据。与 Xstation 的交互必须经过 Xmiddle 中介，不能向站点直接发命令。"]}},"fukushima":{"en":{"title":"Fukushima: the tsunami that transformed Japan’s coast","deck":"The 2011 earthquake, tsunami and nuclear accident, and their consequences for coastal communities and food safety.","body":["On 11 March 2011, a major earthquake triggered a tsunami that hit north-eastern Japan. Fukushima Daiichi nuclear power station experienced serious power and cooling failures, leading to a nuclear accident.","This historical dossier places the disaster in context without reducing environmental impacts to simplistic claims about all seafood. Monitoring, regulation and assessments should rest on scientific and regulatory sources.","This is written editorial content for the prototype, not a hosted video or original documentary film. The source link leads to the IAEA’s research materials."]},"cn":{"title":"福岛：改变日本海岸线的海啸","deck":"回顾 2011 年地震、海啸、核事故及其对沿海社区和食品安全的影响。","body":["2011 年 3 月 11 日，日本东北地区遭遇大地震与海啸。福岛第一核电站出现严重断电及冷却系统故障，最终引发核事故。","这篇历史专题解释灾害背景，但不会把复杂的环境影响简化成“所有海产品都不安全”等不科学的断言。相关环境监测、食品监管和评估应以科学研究及监管机构资料为依据。","本专题为原型中的原创文字内容，不是内嵌视频或纪录片。来源链接指向国际原子能机构（IAEA）的相关研究资料。"]}},"boja":{"en":{"title":"Gil Eanes and Cape Bojador: beyond the Atlantic frontier","deck":"Portuguese voyages in the 15th century, their routes, encounters and conflicts.","body":["According to Portuguese historical scholarship, Gil Eanes rounded Cape Bojador on the West African coast in 1434 while serving Prince Henry the Navigator.","The voyage is often presented as a milestone in Portuguese overseas expansion. A critical account must also consider the violence, captive-taking and trade in enslaved people that accompanied later expeditions.","This is a historical text dossier for demonstration, not an audiovisual documentary. The link leads to NOVA FCSH’s Virtual Encyclopedia of Portuguese Expansion."]},"cn":{"title":"吉尔·埃阿内斯与博哈多尔角：跨越大西洋边界","deck":"回顾 15 世纪葡萄牙航海、航线拓展以及随之而来的交流与冲突。","body":["根据葡萄牙历史研究记载，1434 年吉尔·埃阿内斯（Gil Eanes）奉航海家恩里克王子之命，绕过西非海岸的博哈多尔角。","这段航行通常被视为葡萄牙海外扩张的重要节点。但完整的历史叙述也必须讨论之后的航海扩张所伴随的暴力、人口掠夺和奴隶贸易。","这是用于演示的历史图文专题，不是影视纪录片。来源链接指向 NOVA FCSH 的《葡萄牙海外扩张虚拟百科全书》。"]}}};

STORIES.unshift(...[{"id":"groenlandia","type":"Ensaio","date":"12 nov 2026","source":"Arctic Science · DTU Aqua","url":"https://doi.org/10.1139/as-2025-0028","asset":"https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1400&q=82","contracts":["PSS","CRP","ANC"],"featured":true,"title":"Aquecimento global, Gronelândia e peixes","deck":"O degelo e a subida da temperatura do oceano alteram habitats e pescarias. Quem ganha, quem perde — e o que ainda não sabemos?","body":["O aquecimento global não altera apenas a paisagem gelada da Gronelândia. Também modifica a temperatura da água, a cobertura de gelo marinho e a disponibilidade de alimento, fatores que moldam a distribuição das espécies de peixe. Os seus efeitos variam entre regiões e espécies: não existe um único resultado para «a pesca da Gronelândia».","Um estudo publicado em Arctic Science em 2026, que combina dados de arrasto científico com conhecimento local e indígena, encontrou um declínio do bacalhau-do-Ártico (Boreogadus saida) e uma deslocação da sua distribuição para norte nas águas da Gronelândia desde o início dos anos 1990. Este peixe não deve ser confundido com o bacalhau-do-Atlântico, Gadus morhua, que tem uma ecologia e uma importância comercial diferentes.","A mudança pode repercutir-se em toda a cadeia alimentar: peixes pequenos alimentam predadores, incluindo focas e aves marinhas. À medida que alguns organismos se deslocam, podem alterar-se também as zonas de pesca, os custos das deslocações e o calendário das capturas. A mudança não garante ganhos económicos: mais acesso a certas águas não equivale automaticamente a stocks sustentáveis.","Para os mercados, a ligação plausível é indireta. Se a abundância, o esforço de pesca ou a logística mudarem, a oferta poderá variar; mas a formação dos preços depende também de quotas, combustível, custos, procura, transformação e comércio internacional. Não é possível deduzir o preço futuro de uma espécie apenas a partir do degelo.","Na YFISH, este tema integra o observatório de mercado como análise editorial. Os contratos e gráficos da Bolsa do Mar são fictícios e não traduzem previsões científicas sobre a Gronelândia. Fonte principal: Jansen e colaboradores, Arctic Science (2026), DOI 10.1139/as-2025-0028."],"i18n":{"pt":{"title":"Aquecimento global, Gronelândia e peixes","deck":"O degelo e a subida da temperatura do oceano alteram habitats e pescarias. Quem ganha, quem perde — e o que ainda não sabemos?","body":["O aquecimento global não altera apenas a paisagem gelada da Gronelândia. Também modifica a temperatura da água, a cobertura de gelo marinho e a disponibilidade de alimento, fatores que moldam a distribuição das espécies de peixe. Os seus efeitos variam entre regiões e espécies: não existe um único resultado para «a pesca da Gronelândia».","Um estudo publicado em Arctic Science em 2026, que combina dados de arrasto científico com conhecimento local e indígena, encontrou um declínio do bacalhau-do-Ártico (Boreogadus saida) e uma deslocação da sua distribuição para norte nas águas da Gronelândia desde o início dos anos 1990. Este peixe não deve ser confundido com o bacalhau-do-Atlântico, Gadus morhua, que tem uma ecologia e uma importância comercial diferentes.","A mudança pode repercutir-se em toda a cadeia alimentar: peixes pequenos alimentam predadores, incluindo focas e aves marinhas. À medida que alguns organismos se deslocam, podem alterar-se também as zonas de pesca, os custos das deslocações e o calendário das capturas. A mudança não garante ganhos económicos: mais acesso a certas águas não equivale automaticamente a stocks sustentáveis.","Para os mercados, a ligação plausível é indireta. Se a abundância, o esforço de pesca ou a logística mudarem, a oferta poderá variar; mas a formação dos preços depende também de quotas, combustível, custos, procura, transformação e comércio internacional. Não é possível deduzir o preço futuro de uma espécie apenas a partir do degelo.","Na YFISH, este tema integra o observatório de mercado como análise editorial. Os contratos e gráficos da Bolsa do Mar são fictícios e não traduzem previsões científicas sobre a Gronelândia. Fonte principal: Jansen e colaboradores, Arctic Science (2026), DOI 10.1139/as-2025-0028."]},"en":{"title":"Global Warming, Greenland, and Fish","deck":"Melting ice and warmer seas reshape habitats and fisheries. Who might benefit, who faces risks, and what remains uncertain?","body":["Global warming is changing more than Greenland’s icy landscape. It also affects seawater temperature, sea-ice cover and food availability, all of which influence where fish species can live. Impacts vary by region and species; there is no single outcome for “Greenland’s fisheries”.","A 2026 Arctic Science study combining scientific trawl surveys with local and Indigenous knowledge reported a decline in Arctic cod (Boreogadus saida) and a northward shift in its distribution in Greenlandic waters since the early 1990s. Arctic cod must not be confused with Atlantic cod (Gadus morhua), a different species with distinct commercial significance.","Those changes may ripple through the food web: small fish sustain predators including seals and seabirds. As distributions shift, fishing grounds, travel costs and catch seasons may shift too. Greater access to certain waters does not automatically translate into sustainable catches or economic gains.","The market connection is indirect. Changes in abundance, fishing effort or logistics might affect supply, but prices also depend on quotas, fuel, demand, processing capacity and international trade. Melting ice alone cannot predict future prices.","At YFISH, this is editorial market analysis, not an investment signal. Bolsa do Mar quotes and contracts are fictional and do not express scientific price forecasts for Greenland. Main source: Jansen et al., Arctic Science (2026), DOI 10.1139/as-2025-0028."]},"cn":{"title":"全球变暖、格陵兰与鱼类","deck":"海冰减少与海水升温正在重塑渔业生态。谁可能受益，谁承担风险，又有哪些未知？","body":["全球变暖改变的不只是格陵兰冰雪覆盖的景观。海水温度、海冰范围和食物供给也在变化，进而影响鱼类适合生存的区域。不同海域和物种的反应不一样，不能把“格陵兰渔业”概括成统一的赢家或输家。","2026 年发表于《Arctic Science》的一项研究，结合科学拖网调查和当地及原住民知识，发现自 1990 年代初以来，格陵兰海域的北极鳕（Boreogadus saida）数量下降，分布向北迁移。这里的北极鳕不等于商业上常说的大西洋鳕（Gadus morhua），两者是不同物种。","鱼类迁移还会影响食物网：小型鱼是海豹、海鸟等捕食者的重要食物。鱼群移动后，捕捞地点、航程成本和渔期都可能随之变化。但某些水域更容易进入，并不意味着捕捞量一定增加，更不意味着渔业一定可持续。","对于市场，影响链条是间接的。鱼群丰度、捕捞努力和物流变化可能影响供给，但价格同时受配额、燃油、消费需求、加工能力及国际贸易左右。因此不能仅凭海冰融化就预测某种鱼的期货价格。","在 YFISH 中，这是一篇科学依据明确的市场分析，并非投资信号。“海洋交易所”的行情和合约仍为虚构模拟，不代表针对格陵兰的科学价格预测。主要来源：Jansen 等，《Arctic Science》（2026），DOI：10.1139/as-2025-0028。"]}}},{"id":"ensaio","type":"Ensaio","date":"12 nov 2026","source":"Fishy Times · Ensaio","url":"","asset":"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1300&q=82","contracts":["SRD","ANC","ATM"],"title":"FFs — Fish Futures: o futuro do peixe?","deck":"Um ensaio sobre o valor do mar, o risco dos pescadores e o limite entre proteção de preços e especulação.","body":["Um peixe é, antes de mais, alimento. Mas muito antes de chegar à mesa é também trabalho, combustível, rede, gelo, tempo e incerteza. A sua cotação resulta de decisões tomadas no mar e em terra; não cabe num único número a piscar a verde ou a vermelho.","Os contratos de futuros nasceram, entre outras razões, da necessidade de reduzir a incerteza. Em teoria, um produtor pode fixar antecipadamente um preço de venda e um comprador pode limitar o risco de uma subida inesperada. O objetivo de cobertura de risco (hedging) é diferente do objetivo de apostar numa variação de preços.","No pescado, porém, a operação levanta problemas difíceis. O peixe não é um produto perfeitamente homogéneo: variam a espécie, o tamanho, a frescura, o método de captura, a época e o local de desembarque. Um contrato que ignore essas diferenças poderá ter um preço elegante e uma utilidade económica escassa.","A especulação pode acrescentar liquidez, mas também amplificar conflitos de interesse ou interpretações enganosas, sobretudo num mercado pouco profundo. O que protege um pescador pode expor outro participante a perdas; um gráfico em tempo real não equivale a transparência se a origem dos dados for obscura.","Por isso, uma plataforma responsável deve distinguir três coisas: a transação física do pescado, a informação pública sobre oferta e procura e os instrumentos financeiros que exigiriam regras, supervisão e contrapartes reais. Misturá-las sem uma fronteira clara seria uma falha de conceção, não uma inovação.","A YFISH propõe uma hipótese de aprendizagem: visualizar preços simulados, explorar cenários e compreender riscos sem movimentar dinheiro real. A ideia mais promissora não é transformar cada sardinha numa aposta; é usar melhores dados para que produtores, comerciantes e consumidores tomem decisões mais informadas. Este texto é um ensaio de opinião, não aconselhamento financeiro."],"i18n":{"pt":{"title":"FFs — Fish Futures: o futuro do peixe?","deck":"Um ensaio sobre o valor do mar, o risco dos pescadores e o limite entre proteção de preços e especulação.","body":["Um peixe é, antes de mais, alimento. Mas muito antes de chegar à mesa é também trabalho, combustível, rede, gelo, tempo e incerteza. A sua cotação resulta de decisões tomadas no mar e em terra; não cabe num único número a piscar a verde ou a vermelho.","Os contratos de futuros nasceram, entre outras razões, da necessidade de reduzir a incerteza. Em teoria, um produtor pode fixar antecipadamente um preço de venda e um comprador pode limitar o risco de uma subida inesperada. O objetivo de cobertura de risco (hedging) é diferente do objetivo de apostar numa variação de preços.","No pescado, porém, a operação levanta problemas difíceis. O peixe não é um produto perfeitamente homogéneo: variam a espécie, o tamanho, a frescura, o método de captura, a época e o local de desembarque. Um contrato que ignore essas diferenças poderá ter um preço elegante e uma utilidade económica escassa.","A especulação pode acrescentar liquidez, mas também amplificar conflitos de interesse ou interpretações enganosas, sobretudo num mercado pouco profundo. O que protege um pescador pode expor outro participante a perdas; um gráfico em tempo real não equivale a transparência se a origem dos dados for obscura.","Por isso, uma plataforma responsável deve distinguir três coisas: a transação física do pescado, a informação pública sobre oferta e procura e os instrumentos financeiros que exigiriam regras, supervisão e contrapartes reais. Misturá-las sem uma fronteira clara seria uma falha de conceção, não uma inovação.","A YFISH propõe uma hipótese de aprendizagem: visualizar preços simulados, explorar cenários e compreender riscos sem movimentar dinheiro real. A ideia mais promissora não é transformar cada sardinha numa aposta; é usar melhores dados para que produtores, comerciantes e consumidores tomem decisões mais informadas. Este texto é um ensaio de opinião, não aconselhamento financeiro."]},"en":{"title":"FFs — Fish Futures: the future of fish?","deck":"An essay on the sea’s value, fishers’ risks, and the line between price protection and speculation.","body":["Fish are, first and foremost, food. Long before they reach a plate, they also embody labour, fuel, nets, ice, time and uncertainty. A quoted price reflects decisions made at sea and on land; it cannot be reduced to a single flashing green or red number.","Futures contracts emerged in part to manage uncertainty. In principle, producers can lock in a selling price and buyers can limit their exposure to unexpected increases. Hedging price risk is fundamentally different from betting on a price change.","Seafood nevertheless presents difficult design problems. Fish are not perfectly uniform goods: species, size, freshness, catch method, season and landing port all matter. A contract that ignores those differences may produce a neat chart but little practical benefit.","Speculation can contribute liquidity. In thin markets, however, it may also magnify conflicts of interest and misleading signals. A hedge that protects one fisher may expose someone else to losses; “real-time” is not the same as transparent if the data source is unknown.","A responsible platform must therefore separate physical fish transactions, public supply-and-demand intelligence, and regulated financial instruments that would require real counterparties and oversight. Collapsing those boundaries would be poor system design, not innovation.","YFISH offers an educational experiment: simulated quotes, scenario exploration and risk awareness without moving real money. The more promising idea is not to turn every sardine into a bet, but to use better information to help producers, traders and consumers make decisions. This is an opinion essay, not financial advice."]},"cn":{"title":"FFs 鱼类期货：鱼的未来？","deck":"一篇关于海洋价值、渔民风险，以及价格保障与投机边界的议论文。","body":["鱼首先是食物。但在进入餐桌之前，它承载的还有渔民的劳动、燃油、渔网、冰块、时间以及不确定性。一条价格曲线包含了海上和陆上的各种决策，不能被简化成不停闪烁的红绿数字。","期货合约出现的重要原因之一，是管理不确定性。理论上，生产者可以提前锁定售价，买方可以限制成本意外上升的风险。这种套期保值与单纯押注价格涨跌，是两种不同的目的。","然而，鱼类市场很难直接照搬标准化合约。鱼并不是完全同质的商品：物种、体型、鲜度、捕捞方式、季节和上岸港口都影响价值。忽略这些差异的合约，图表可能精美，却未必有多少真实经济用途。","投机有可能增加市场流动性，但在交易稀薄的市场中，也可能放大利益冲突和误导性信号。能够保护一个渔民的对冲安排，可能让另一个参与者承担损失；如果数据来源不透明，“实时”并不等于透明。","因此，负责任的平台必须区分三件事：真实鱼货交易、供需信息服务，以及需要监管和真实交易对手的金融工具。如果把它们混在一起，并不是创新，而是系统设计中的边界错误。","YFISH 提供一种学习性的探索：用模拟行情理解价格、情景和风险，而不涉及真实资金。真正值得尝试的不是把每条沙丁鱼变成赌注，而是让渔民、商家和消费者依靠更可靠的信息做决定。本文为观点性议论文，不构成投资建议。"]}}}]);

const nodeOrigins=new WeakMap(),attrOrigins=new WeakMap();
function tr(value){const raw=String(value??'');if(S.lang==='pt')return raw;const norm=raw.trim().replace(/\s+/g,' ');const result=UI_DICT[norm]?.[S.lang];if(result!==undefined)return raw.slice(0,raw.indexOf(norm)) + result + raw.slice(raw.indexOf(norm)+norm.length);
 let dyn=norm.match(/^(\d+) produtos$/);if(dyn)return S.lang==='en'?`${dyn[1]} products`:`${dyn[1]} 件商品`;
 dyn=norm.match(/^Pedido (.+)$/);if(dyn)return S.lang==='en'?`Order ${dyn[1]}`:`订单 ${dyn[1]}`;
 dyn=norm.match(/^Lance mínimo:\s*(.+?)\s*·\s*Incremento:\s*(.+)$/);if(dyn)return S.lang==='en'?`Minimum bid: ${dyn[1]} · Increment: ${dyn[2]}`:`最低出价：${dyn[1]} · 加价幅度：${dyn[2]}`;
 if(raw.length>7){let localized=raw;for(const [pt,v] of UI_PARTIALS){if(localized.includes(pt))localized=localized.replaceAll(pt,v[S.lang]);}return localized;}return raw;
}
const UI_PARTIALS=Object.entries(UI_DICT).filter(([k])=>k.length>=12&& !k.includes('·') && !k.includes('€')).sort((a,b)=>b[0].length-a[0].length);
function translateDOM(root){if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){return n.parentElement?.closest('script,style,svg')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});let n;while((n=walker.nextNode())){if(!nodeOrigins.has(n))nodeOrigins.set(n,n.textContent);let orig=nodeOrigins.get(n);if(orig&&orig.trim()){const v=tr(orig);if(n.textContent!==v)n.textContent=v}}
 const elements=[root,...root.querySelectorAll('*')];for(const el of elements){for(const attr of ['placeholder','aria-label','title']){if(!el.hasAttribute?.(attr))continue;let rec=attrOrigins.get(el);if(!rec){rec={};attrOrigins.set(el,rec)}if(!(attr in rec))rec[attr]=el.getAttribute(attr);const v=tr(rec[attr]);if(v!==el.getAttribute(attr))el.setAttribute(attr,v)}}}
function translateChrome(){translateDOM(document.querySelector('.topbar'));translateDOM(document.querySelector('.footerline'));translateDOM(document.querySelector('.mobile-tab'));translateDOM(document.querySelector('.desktop-nav'));}

function drawSpark(canvas,series,color,fill=false){if(!canvas)return;let w=canvas.clientWidth||270,h=canvas.clientHeight||75,dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const vals=series.slice(-90),lo=Math.min(...vals),hi=Math.max(...vals),spread=hi-lo||1;ctx.beginPath();vals.forEach((v,i)=>{const x=2+i/(vals.length-1)*(w-4),y=h-7-(v-lo)/spread*(h-17);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(fill){ctx.save();ctx.lineTo(w-2,h);ctx.lineTo(2,h);ctx.closePath();ctx.fillStyle='rgba(45,218,187,.11)';ctx.fill();ctx.restore();ctx.beginPath();vals.forEach((v,i)=>{const x=2+i/(vals.length-1)*(w-4),y=h-7-(v-lo)/spread*(h-17);i?ctx.lineTo(x,y):ctx.moveTo(x,y)})}ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke()}

<section class="panel"><div class="section-head"><h2>Lista de observação</h2></div>${S.watchlist.length?S.watchlist.map(id=>{const c=contract(id);if(!c)return '';return `<div class="between" data-contract="${id}" style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer"><div><b style="font-size:13px">${fishName(c)}</b><div class="contract-detail">${id}-F27</div></div><div style="text-align:right"><b>${money(q(id).price)}</b><div class="${moveClass(pct(id))}" style="font-size:11px">${signedPct(pct(id))}</div></div></div>`}).join(''):'<div class="empty">Selecione uma estrela para seguir.</div>'}</section>

function drawChart(){const canvas=node('price-chart');if(!canvas)return;const parent=canvas.parentElement;const w=parent.clientWidth,h=parent.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);if(w<20||h<20)return;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const n={'1H':35,'1D':100,'1S':180,'1M':240}[S.period]||100,series=q(S.instrument).series.slice(-n),L=53,R=15,T=18,B=31,plotW=w-L-R,plotH=h-T-B;const lo=Math.min(...series),hi=Math.max(...series),pad=(hi-lo||hi*.06||1)*.2,min=lo-pad,max=hi+pad,y=v=>T+(max-v)/(max-min)*plotH,x=i=>L+i/(series.length-1)*plotW;
ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e9eef2';ctx.lineWidth=1;ctx.fillStyle='#92a1ac';ctx.font='11px DM Sans, system-ui';for(let i=0;i<=4;i++){let yp=T+i*plotH/4;ctx.beginPath();ctx.moveTo(L,yp);ctx.lineTo(w-R,yp);ctx.stroke();ctx.textAlign='right';ctx.fillText((max-i*(max-min)/4).toFixed(2).replace('.',','),L-9,yp+4)}ctx.textAlign='center';['−'+(n===35?'45 min':n===100?'1 dia':n===180?'1 sem':'1 mês'),'−'+(n===35?'20 min':n===100?'12 h':n===180?'3 dias':'15 dias'),'Agora'].forEach((s,i)=>ctx.fillText(s,L+i*plotW/2,h-8));const positive=series.at(-1)>=series[0];ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.lineTo(x(series.length-1),T+plotH);ctx.lineTo(L,T+plotH);ctx.closePath();const gradient=ctx.createLinearGradient(0,T,0,T+plotH);gradient.addColorStop(0,positive?'rgba(13,160,128,.16)':'rgba(221,88,84,.13)');gradient.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();series.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle=positive?'#0c9b7b':'#dd6666';ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();const last=series.at(-1);ctx.beginPath();ctx.arc(x(series.length-1),y(last),4,0,Math.PI*2);ctx.fillStyle=positive?'#0c9b7b':'#dd6666';ctx.fill();canvas._chart={series,L,R,T,B,plotW,plotH,min,max,x,y};
if(S.chartHover>=0){const i=Math.min(series.length-1,S.chartHover);ctx.strokeStyle='#9eacb8';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x(i),T);ctx.lineTo(x(i),T+plotH);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(x(i),y(series[i]),4,0,Math.PI*2);ctx.fillStyle='#143b50';ctx.fill()}}
function bindChart(){const c=node('price-chart');if(!c||c.dataset.bound)return;c.dataset.bound='1';c.addEventListener('pointermove',event=>{const r=c.getBoundingClientRect(),data=c._chart;if(!data)return;let i=Math.round((event.clientX-r.left-data.L)/data.plotW*(data.series.length-1));S.chartHover=Math.max(0,Math.min(data.series.length-1,i));const tip=node('chart-tooltip');if(tip){tip.style.display='block';tip.style.left=Math.min(Math.max(event.clientX-r.left+9,10),r.width-112)+'px';tip.style.top=Math.max(3,data.y(data.series[S.chartHover])-45)+'px';tip.textContent=money(data.series[S.chartHover])+' / kg'}drawChart()});c.addEventListener('pointerleave',()=>{S.chartHover=-1;const tip=node('chart-tooltip');if(tip)tip.style.display='none';drawChart()})}
function renderPortfolio(){const unreal=floatingPL(),positions=S.positions;return `${header('Carteira','Acompanhe posições, margem e histórico das operações virtuais.',`<button class="btn outline sm" data-action="export">${icon('download')} Exportar CSV</button>`)}<div class="portfolio-kpi"><div class="stat"><div class="eyebrow">Património virtual</div><div class="headline-stat">${money(equity())}</div><div class="submetric">Saldo + margem + resultados</div></div><div class="stat"><div class="eyebrow">Disponível</div><div class="headline-stat">${money(S.cash)}</div><div class="submetric">Para novas posições</div></div><div class="stat"><div class="eyebrow">Resultado total</div><div class="headline-stat ${moveClass(S.realized+unreal)}">${signMoney(S.realized+unreal)}</div><div class="submetric">Realizado + não realizado</div></div></div><div class="panel" style="margin-bottom:17px"><div class="section-head"><h2>Posições abertas</h2><span class="pill">${positions.length} posições</span></div>${positions.length?`<div class="scroll-table"><table class="position-table"><thead><tr><th>Contrato</th><th>Direção</th><th class="right">Qtd.</th><th class="right">Entrada</th><th class="right">Atual</th><th class="right">Resultado</th><th class="right"></th></tr></thead><tbody>${positions.map(p=>`<tr><td><b>${esc(fishName(contract(p.id)))}</b><div class="contract-detail">${p.id}-F27 · 10 kg</div></td><td><span class="pill ${p.side==='long'?'green':'red'}">${p.side==='long'?'Long':'Short'}</span></td><td class="right">${p.qty}</td><td class="right">${money(p.entry)}</td><td class="right">${money(q(p.id).price)}</td><td class="right ${moveClass(positionPL(p))}"><b>${signMoney(positionPL(p))}</b></td><td class="right"><button class="btn outline sm" data-close-position="${p.uid}">Fechar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ainda não tem posições. Abra uma ordem simulada na Bolsa do Mar.</div>'}</div>
<div class="panel" style="margin-bottom:17px"><div class="section-head"><h2>Ordens pendentes</h2><span class="pill">${S.pending.length}</span></div>${S.pending.length?`<div class="scroll-table"><table class="position-table"><thead><tr><th>Produto</th><th>Operação</th><th class="right">Qtd.</th><th class="right">Limite</th><th class="right"></th></tr></thead><tbody>${S.pending.map(p=>`<tr><td>${esc(fishName(contract(p.id)))}</td><td>${p.side==='long'?'Compra':'Venda'}</td><td class="right">${p.qty}</td><td class="right">${money(p.limit)}</td><td class="right"><button class="btn outline sm" data-cancel-order="${p.uid}">Cancelar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Não existem ordens limitadas pendentes.</div>'}</div>
<div class="panel"><div class="orders-bar"><h2>Atividade recente</h2><button class="btn ghost sm" data-action="reset-market">Repor simulação</button></div>${S.history.length?S.history.slice(0,12).map(h=>`<div class="between" style="padding:12px 0;border-top:1px solid var(--line);font-size:12px"><div><b>${esc(h.label)}</b><div class="muted" style="font-size:10px">${fmtDate.format(new Date(h.at))}</div></div><b class="${moveClass(h.pnl||0)}">${h.pnl===undefined?money(h.value||0):signMoney(h.pnl)}</b></div>`).join(''):'<div class="empty">Os movimentos surgirão aqui.</div>'}</div>`}
function placeTrade(){const qty=Number(node('trade-qty')?.value||S.tradeQty),limit=Number(node('trade-limit')?.value),c=contract(S.instrument),side=S.tradeSide==='buy'?'long':'short';if(!Number.isInteger(qty)||qty<1||qty>100)return toast('Indique entre 1 e 100 contratos.');if(S.tradeType==='limit'){if(!Number.isFinite(limit)||limit<=0)return toast('Introduza um preço limite válido.');S.pending.unshift({uid:uid('ord'),id:c.id,side,qty,limit,at:Date.now()});persist();toast('Ordem limitada registada na simulação.');renderActive(false);return}openPosition(c.id,side,qty,q(c.id).price,true)}
function openPosition(id,side,qty,price,showToast=false){const required=price*qty*10*.25;if(required>S.cash+1e-8){if(showToast)toast('Saldo virtual insuficiente para a margem inicial.');return false}S.cash=Math.round((S.cash-required)*100)/100;S.positions.unshift({uid:uid('pos'),id,side,qty,entry:price,margin:required,at:Date.now()});S.history.unshift({label:`${side==='long'?'Long':'Short'} · ${contract(id)?.name} × ${qty}`,value:required,at:Date.now()});persist();if(showToast)toast('Posição aberta na carteira de simulação.');renderActive(false);return true}
function closePosition(uid0,forced=false){const idx=S.positions.findIndex(p=>p.uid===uid0);if(idx<0)return;const p=S.positions.splice(idx,1)[0],pnl=Math.round(positionPL(p)*100)/100;S.cash=Math.round((S.cash+p.margin+pnl)*100)/100;S.realized+=pnl;S.history.unshift({label:`${forced?'Liquidação automática':'Fecho'} · ${fishName(contract(p.id))} × ${p.qty}`,pnl,at:Date.now()});persist();toast(forced?'Posição liquidada por controlo de risco.':`Posição fechada: ${signMoney(pnl)}.`);renderActive(false)}
function matchPending(){let changed=false;S.pending=S.pending.filter(p=>{const value=q(p.id)?.price;if(!value)return true;const matches=p.side==='long'?value<=p.limit:value>=p.limit;if(matches){if(openPositionSilent(p,value)){changed=true;return false}}return true});if(changed){persist();toast('Uma ordem limitada foi executada.')} // Demo maintenance margin: automatic liquidation at 50% of initial total margin.
let guard=0;while(S.positions.length&&equity()<usedMargin()*.5&&guard++<20){const p=S.positions[0];S.positions.shift();const pnl=positionPL(p);S.cash=Math.round((S.cash+p.margin+pnl)*100)/100;S.realized+=pnl;S.history.unshift({label:`Liquidação por margem · ${fishName(contract(p.id))}`,pnl,at:Date.now()});changed=true}if(changed)persist();}
function openPositionSilent(p,price){const margin=price*p.qty*10*.25;if(margin>S.cash)return false;S.cash=Math.round((S.cash-margin)*100)/100;S.positions.unshift({uid:uid('pos'),id:p.id,side:p.side,qty:p.qty,entry:price,margin,at:Date.now()});S.history.unshift({label:`Ordem limitada executada · ${fishName(contract(p.id))}`,value:margin,at:Date.now()});return true}
function uid(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.floor(random()*1e7).toString(36)}`}
function exportCSV(){const rows=[['ID','Produto','Direção','Quantidade','Preço de entrada','Preço atual','Margem','Resultado não realizado'],...S.positions.map(p=>[p.uid,fishName(contract(p.id)),p.side,p.qty,p.entry,q(p.id).price,p.margin,positionPL(p)])];const content='\ufeff'+rows.map(row=>row.map(s=>'"'+String(s??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='YFISH_carteira_simulada.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderNews(){let cards=STORIES.filter(s=>S.newsFilter==='Todas'||(S.newsFilter==='Notícias'&&s.type!=='Documentários'&&s.type!=='Ensaio')||(S.newsFilter==='Documentários'&&s.type==='Documentários')||(S.newsFilter==='Ensaios'&&s.type==='Ensaio'));const f=STORIES[0];return `${header('Fishy Times','Notícias, inteligência de mercado e histórias do oceano.',`<span class="pill">Edição · 12 nov 2026</span>`)}<article class="news-feature" data-story="${f.id}"><div class="news-art"><img src="${f.asset}" alt="Mar agitado" loading="lazy" onerror="this.style.opacity=0"></div><div class="news-feature-info"><span class="pill orange" style="align-self:start">Em destaque · Fonte verificada</span><h2>${storyField(f,'title')}</h2><p>${storyField(f,'deck')}</p><div class="between"><span class="article-meta">${f.source} · ${storyDate(f)}</span><span class="source-link">Ler artigo ${icon('arrow')}</span></div></div></article><div class="section-head"><h2>Últimas publicações</h2><div class="tabset">${['Todas','Notícias','Ensaios','Documentários'].map(x=>`<button class="tab ${S.newsFilter===x?'active':''}" data-news-filter="${x}">${x}</button>`).join('')}</div></div><div class="editor-grid">${cards.map(a=>`<article class="article-card" data-story="${a.id}"><div class="article-picture"><img src="${a.asset}" alt="" loading="lazy" onerror="this.style.opacity=0"></div><div class="article-body"><div class="eyebrow">${storyType(a)}</div><h3>${storyField(a,'title')}</h3><p>${storyField(a,'deck')}</p><div class="article-meta">${a.source} <span>·</span> ${storyDate(a)}</div></div></article>`).join('')}</div>${renderScenario()}<div style="margin:34px 0 17px" class="section-head"><div><div class="eyebrow" style="margin-bottom:6px">Arquivo histórico</div><h2>Documentários & histórias</h2></div></div><div class="grid grid-2">${STORIES.filter(x=>x.type==='Documentários').map(a=>`<div class="video-card" data-story="${a.id}"><img src="${a.asset}" alt="" loading="lazy" onerror="this.style.opacity=0"><div class="inner"><span class="play">${icon('arrow')}</span><div class="eyebrow">Dossiê documental · ${storyDate(a)}</div><h3>${storyField(a,'title')}</h3><div style="color:#a4cbcf;font-size:12px">Explorar a história e as fontes</div></div></div>`).join('')}</div><div class="notice" style="margin-top:20px">Artigos baseados em fontes identificadas ou assinalados como análise. Os conteúdos são editoriais estáticos: não existe uma redação com publicação automática nem uma ligação contínua a agências de notícias.</div>`}
function renderScenario(){const scenarios={charles:{name:'Depressão Charles',supply:47,demand:74,detail:'Hipótese de menor frequência de saídas para o mar perante avisos de mau tempo. Não há quantificação real de descargas ou preços.'},elnino:{name:'El Niño / anchovas',supply:37,demand:81,detail:'Hipótese de menor oferta de anchova e maior tensão na procura de matérias-primas para alimentação animal. Não corresponde a um índice oficial.'},normal:{name:'Condições habituais',supply:71,demand:69,detail:'Referência neutra para comparação. Valores inteiramente ilustrativos.'}};const v=scenarios[S.scenario]||scenarios.charles;const diff=(v.demand-v.supply)*.22;return `<section class="panel" style="margin-top:26px"><div class="section-head"><div><div class="eyebrow" style="margin-bottom:5px">Observatório · Simulação</div><h2>Oferta e procura</h2></div><span class="pill orange">Cenários hipotéticos</span></div><div class="scenario-buttons">${Object.entries(scenarios).map(([id,s])=>`<button data-scenario="${id}" class="${S.scenario===id?'active':''}">${s.name}</button>`).join('')}</div><div class="grid grid-2" style="margin-top:14px;align-items:center"><div><div class="pressure-row"><label>Oferta</label><div class="pressure-track"><div class="pressure-fill" style="width:${v.supply}%"></div></div><b class="numeric">${v.supply}</b></div><div class="pressure-row"><label>Procura</label><div class="pressure-track"><div class="pressure-fill demand" style="width:${v.demand}%"></div></div><b class="numeric">${v.demand}</b></div></div><div style="padding:8px 20px"><div class="eyebrow">Pressão de preço hipotética</div><div class="headline-stat ${moveClass(diff)}" style="margin:6px 0">${signedPct(diff)}</div><div class="muted" style="font-size:11px">Índice interno fictício · Sem valor preditivo</div></div></div><p class="muted" style="font-size:12px;margin:10px 0 0">${v.detail}</p></section>`}
function articleModal(id){const a=STORIES.find(x=>x.id===id);if(!a)return;showModal(`<img class="modal-photo" src="${esc(a.asset)}" alt="" onerror="this.style.opacity=0"><div class="modal-inner"><div class="eyebrow">Fishy Times · ${storyType(a)} · ${storyDate(a)}</div><h2 id="dialog-title" style="font-size:29px;line-height:1.17;margin:11px 0">${storyField(a,'title')}</h2><div class="muted" style="font-size:12px;margin-bottom:18px">${a.source} · ${a.type==='Análise'?'Conteúdo ilustrativo':'Fonte externa identificada'}</div>${storyField(a,'body').map(p=>`<p style="font-size:14px;color:#415567;line-height:1.8">${p}</p>`).join('')}${a.contracts.length?`<div class="panel" style="padding:14px 17px;box-shadow:none;margin:18px 0"><div class="eyebrow">Mercados relacionados · Simulados</div><div class="row wrap" style="margin-top:9px">${a.contracts.map(c=>`<button data-story-contract="${c}" class="btn outline sm">${fishName(contract(c))} ${icon('arrow')}</button>`).join('')}</div></div>`:''}${a.sources?.length?`<div class="article-sources"><div class="eyebrow">${L('Fontes e documentos','Sources and documents','来源与文献')}</div><div class="source-list">${a.sources.map(src=>`<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.name)} <span>↗</span></a>`).join('')}</div></div>`:a.url?`<a class="btn primary" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Consultar fonte original ${icon('arrow')}</a>`:''}<div class="notice yellow" style="margin-top:16px">As notícias não são cotações. Relações causais entre acontecimentos e preços futuros exigem análise e dados adicionais.</div></div>`,'wide')}

<div class="eyebrow">Maré+</div><div class="big" style="font-size:18px">${S.membership?L('Ativo','Active','已开通'):L('Essencial','Essential','基础版')}</div></div><div class="profile-stat"><div class="eyebrow">FFs</div><div class="big">${S.positions.length}</div></div></div><div class="grid grid-2"><div class="panel"><div class="section-head"><h2>${L('Atividade','Activity','活动')}</h2></div><div class="data-line"><span>${L('Perfil','Role','角色')}</span><b>${esc(a.role)}</b></div><div class="data-line"><span>${L('Conta criada','Account created','注册日期')}</span><b>${new Date(a.created).toLocaleDateString()}</b></div><div class="data-line"><span>${L('Dados financeiros','Financial data','交易数据')}</span><b>${S.positions.length} ${L('posições','positions','持仓')}</b></div></div><div class="panel"><h2>${L('Atalhos','Shortcuts','快捷入口')}</h2><div class="stack" style="margin-top:17px"><button class="btn outline full" data-nav="pedidos">${L('Acompanhar encomendas','Track orders','查看订单')} →</button><button class="btn outline full" data-nav="xstations">${L('Ver Xstations','View Xstations','查看 Xstations')} →</button><button class="btn outline full" data-nav="noticias">Fishy Times →</button>${a.role!=='cliente'?`<button class="btn outline full" data-nav="operacoes">${L('Operações internas','Internal operations','内部运营')} →</button>`:''}</div></div></div><div class="notice" style="margin-top:20px">${L('Identidade e dados guardados neste navegador. Este ambiente não é um serviço de autenticação pública nem processa pagamentos.','Identity and data are stored in this browser. This environment does not provide public authentication or process payments.','身份和数据保存在当前浏览器。本环境不提供公共账号认证，也不处理真实支付。')}</div></div>`}
function opsGate(){const a=currentAccount();return a&&a.role!=='cliente'}
function renderOps(){const a=currentAccount();if(!a)return `<div class="page-tight">${header(L('Operações','Operations','运营'))}<div class="panel"><h2>${L('Área de equipa','Team workspace','团队工作区')}</h2><p class="muted">${L('Inicie sessão com um perfil operacional.','Sign in with an operations role.','请使用运营角色登录。')}</p><button class="btn primary" data-ext-action="auth-login">${L('Entrar','Sign in','登录')}</button></div></div>`;if(!opsGate())return `<div class="page-tight">${header(L('Operações','Operations','运营'))}<div class="panel"><h2>${L('Acesso reservado à equipa YFISH','YFISH team access','仅限 YFISH 团队')}</h2><p class="muted">${L('Este perfil permite compras e mercados. As operações são reservadas a pescadores, estafetas, editores e gestores.','This account can shop and view markets. Operations are reserved for fishers, couriers, editors and managers.','该账号可购物和浏览市场。运营功能仅限渔民、配送、编辑和管理员。')}</p></div></div>`;
 const tabs=[['encomendas',L('Encomendas','Orders','订单')],['pescado',L('Pescado','Catch','鱼获')],['redacao',L('Redação','Editorial','编辑部')],['xmiddle','Xmiddle']];return `<div class="page-tight">${header(L('Centro de operações','Operations centre','运营中心'),L('Da captura ao levantamento — equipas, conteúdo e Xmiddle.','From catch to collection — teams, content and Xmiddle.','从捕捞到取货：团队、内容和 Xmiddle。'))}<div class="ops-tabs">${tabs.map(([id,name])=>`<button class="${NX.opsTab===id?'active':''}" data-ext-action="ops-tab" data-id="${id}">${name}</button>`).join('')}</div>${NX.opsTab==='encomendas'?renderOpsOrders(a):NX.opsTab==='pescado'?renderOpsCatch(a):NX.opsTab==='redacao'?renderOpsEditorial(a):renderOpsXmiddle(a)}</div>`}
function renderOpsOrders(a){const permitted=['estafeta','gestor'].includes(a.role);return `<div class="grid grid-2"><div class="panel"><div class="section-head"><h2>${L('Fila de expedição','Dispatch queue','配送队列')}</h2><span class="pill">${NX.sharedOrders.filter(o=>o.step<6).length}</span></div>${NX.sharedOrders.length?NX.sharedOrders.slice(0,12).map(o=>`<div class="data-line"><div><b>${esc(o.id)}</b><small>${esc(o.station)} · ${orderStatus(o)}</small></div><div class="row wrap"><button class="btn ghost sm" data-ext-action="order-detail" data-id="${o.id}">${L('Ver','View','查看')}</button>${permitted&&o.step<6?`<button class="btn primary sm" data-ext-action="advance-order" data-id="${o.id}">${L('Avançar','Advance','推进')} →</button>`:''}</div></div>`).join(''):`<div class="empty">${L('Nenhuma encomenda registada.','No orders yet.','暂无订单。')}</div>`}</div><div class="panel"><div class="eyebrow">XSYS / SERVEX</div><h2 style="margin:9px 0 18px">${L('Cadeia de responsabilidade','Responsibility chain','责任链')}</h2><div class="flow-rail" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="flow-block">YFISH<small>${L('Regista encomenda','Creates order','生成订单')}</small></div><div class="flow-block">Xmiddle<small>${L('Valida reserva','Checks reservation','验证预约')}</small></div><div class="flow-block">${L('Estafeta','Courier','配送员')}<small>${L('Deposita PACK','Deposits PACK','存放 PACK')}</small></div><div class="flow-block">Xstation<small>${L('Emite evento','Emits event','发送事件')}</small></div></div><p class="public-note">${L('A equipa logística YFISH é independente da Xoperation-team do SAV.','YFISH logistics is separate from SAV’s Xoperation-team.','YFISH 物流人员独立于 SAV 的 Xoperation-team。')}</p></div></div>`}
function advanceOrder(id){const a=currentAccount();if(!a||!['estafeta','gestor'].includes(a.role))return toast(L('Sem permissão para gerir expedições.','No dispatch permissions.','无配送管理权限。'));const o=NX.sharedOrders.find(o=>o.id===id);if(!o||o.step>=6)return;if(o.step===0&&STATION_CARDS.find(x=>x.id===o.stationId)?.status!=='free')return toast(L('Estação indisponível.','Station unavailable.','站点不可用。'));o.step+=1;o.events.push({at:Date.now(),label:ORDER_STEPS[o.step][0]});if(o.step===1)o.reservation='validada_local';const types=['reserva','reserva_confirmada','preparacao','transporte','deposito_PACK','levantamento_autorizado','levantamento'];addXmiddleEvent(types[o.step],STATION_CARDS.find(s=>s.id===o.stationId)?.ref,o.id,ORDER_STEPS[o.step][0]);networkSave();renderActive(true);toast(L('Estado atualizado.','Status updated.','状态已更新。'))}
function syncCatches(){for(const it of NX.catches){if(!CATALOG.items[it.id])CATALOG.items[it.id]={id:it.id,category:'market',title:it.names,desc:{pt:`Lote registado por ${it.supplier}, com origem declarada em ${it.origin}.`,en:`Lot registered by ${it.supplier}, declared origin ${it.origin}.`,cn:`由 ${it.supplier} 登记，申报产地 ${it.origin}。`},scientific:'',origin:it.origin,method:'Lota',zone:'Portugal',image:CATALOG.items.sardinha.image,premium:false,auction:false,landed:new Date(it.at).toLocaleDateString(),quality:'YFISH',variants:[{id:'1kg',name:{pt:'1 kg',en:'1 kg',cn:'1 千克'},price:it.price}]}}}
function renderOpsCatch(a){const can=['pescador','gestor'].includes(a.role);return `<div class="ops-grid"><div class="panel"><h2>${L('Registo de lotes','Catch registration','鱼获登记')}</h2><p class="muted" style="font-size:12px;margin:9px 0 20px">${L('Origem, quantidade e preço declarados pelo fornecedor.','Supplier-declared origin, quantity and price.','供应商申报产地、数量和价格。')}</p>${can?`<div class="form-field"><label>${L('Espécie','Species','鱼种')}</label><input class="input" id="catch-species" maxlength="70" placeholder="${L('Ex.: Sardinha','E.g. Sardine','例如：沙丁鱼')}"></div><div class="form-field"><label>${L('Origem / lota','Origin / fish market','产地 / 鱼市')}</label><input class="input" id="catch-origin" maxlength="90" placeholder="Sesimbra"></div><div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="form-field"><label>Kg</label><input type="number" id="catch-qty" class="input" min="1" max="10000" step="1" value="20"></div><div class="form-field"><label>€ / kg</label><input type="number" id="catch-price" class="input" min="0.01" max="10000" step="0.01" value="8.5"></div></div><button class="btn primary full" data-ext-action="create-catch">${L('Publicar lote no catálogo','Publish lot to catalog','发布鱼获到商品目录')}</button>`:`<div class="notice">${L('O registo de pescado é efetuado por pescadores e gestores.','Catch registration is for fishers and managers.','鱼获登记仅限渔民及管理员。')}</div>`}</div><div class="panel"><h2>${L('Últimos lotes','Recent lots','最新批次')}</h2>${NX.catches.length?NX.catches.slice(0,9).map(o=>`<div class="data-line"><div><b>${esc(o.names.pt)}</b><small>${esc(o.origin)} · ${esc(o.qty)} kg</small></div><b>${money(o.price)}/kg</b></div>`).join(''):`<div class="empty">${L('Nenhum lote adicional.','No additional lots.','暂无新增批次。')}</div>`}</div></div>`}
function createCatch(){const a=currentAccount();if(!a||!['pescador','gestor'].includes(a.role))return;const name=(node('catch-species')?.value||'').trim(),origin=(node('catch-origin')?.value||'').trim(),qty=Number(node('catch-qty')?.value),price=Number(node('catch-price')?.value);if(name.length<2||origin.length<2||!Number.isFinite(qty)||qty<1||qty>10000||!Number.isFinite(price)||price<=0||price>10000)return toast(L('Verifique os dados do lote.','Check the lot details.','请检查批次数据。'));const it={id:uid('catch'),names:{pt:name,en:name,cn:name},origin,qty,price,supplier:a.name,at:Date.now()};NX.catches.unshift(it);syncCatches();addXmiddleEvent('lote_registado','YFISH',it.id,origin);networkSave();renderActive(true);toast(L('Lote publicado na Peixaria.','Lot published to the shop.','批次已发布到商城。'))}
function syncEditorial(){for(const e of NX.editorial){if(e.status!=='published'||STORIES.some(s=>s.id===e.id))continue;const content={id:e.id,type:'Atualidade',date:new Date(e.at).toLocaleDateString('pt-PT'),source:'Fishy Times / YFISH',url:'',title:e.ptTitle,deck:e.ptBody.slice(0,160),body:e.ptBody.split(/\n+/).filter(Boolean),asset:STORIES[0].asset,contracts:[],i18n:{pt:{title:e.ptTitle,deck:e.ptBody.slice(0,160),body:e.ptBody.split(/\n+/).filter(Boolean)},en:{title:e.enTitle,deck:e.enBody.slice(0,160),body:e.enBody.split(/\n+/).filter(Boolean)},cn:{title:e.cnTitle,deck:e.cnBody.slice(0,160),body:e.cnBody.split(/\n+/).filter(Boolean)}}};STORIES.push(content)}}
function renderOpsEditorial(a){const can=['editor','gestor'].includes(a.role);return `<div class="ops-grid"><div class="panel"><h2>${L('Redação Fishy Times','Fishy Times newsroom','Fishy Times 编辑部')}</h2><p class="muted" style="font-size:12px;margin:8px 0 17px">${L('Criar → Rever → Publicar. Os três idiomas são obrigatórios para publicação.','Create → Review → Publish. All three languages are required.','创建 → 审核 → 发布。发布前须提供三语内容。')}</p>${can?`<div class="form-field"><label>PT-PT · ${L('Título','Title','标题')}</label><input class="input" id="news-pt-title" maxlength="150"></div><div class="form-field"><label>PT-PT · ${L('Texto','Body','正文')}</label><textarea id="news-pt-body" class="input" style="height:95px;padding:13px" maxlength="3000"></textarea></div><div class="form-field"><label>EN · Title</label><input class="input" id="news-en-title" maxlength="150"></div><div class="form-field"><label>EN · Body</label><textarea id="news-en-body" class="input" style="height:75px;padding:13px" maxlength="3000"></textarea></div><div class="form-field"><label>中文 · 标题</label><input class="input" id="news-cn-title" maxlength="150"></div><div class="form-field"><label>中文 · 正文</label><textarea id="news-cn-body" class="input" style="height:75px;padding:13px" maxlength="3000"></textarea></div><button class="btn primary full" data-ext-action="editor-create">${L('Guardar rascunho','Save draft','保存草稿')}</button>`:`<div class="notice">${L('Área reservada à redação e gestores.','Restricted to editors and managers.','仅限编辑和管理员。')}</div>`}</div><div class="panel"><h2>${L('Pipeline editorial','Editorial pipeline','编辑流程')}</h2>${NX.editorial.length?NX.editorial.map(e=>`<div class="data-line"><div style="max-width:60%"><b style="overflow-wrap:anywhere">${esc(e.ptTitle)}</b><small>${e.status==='draft'?L('Rascunho','Draft','草稿'):e.status==='review'?L('Em revisão','In review','审核中'):L('Publicado','Published','已发布')}</small></div>${can&&e.status!=='published'?`<button class="btn primary sm" data-ext-action="editor-next" data-id="${e.id}">${e.status==='draft'?L('Enviar para revisão','Submit for review','提交审核'):L('Publicar','Publish','发布')} →</button>`:''}</div>`).join(''):`<div class="empty">${L('Ainda não existem artigos na fila.','No articles in the queue.','编辑队列为空。')}</div>`}</div></div>`}
function editorialCreate(){const a=currentAccount();if(!a||!['editor','gestor'].includes(a.role))return;const p=['pt','en','cn'].map(l=>({title:(node(`news-${l}-title`)?.value||'').trim(),body:(node(`news-${l}-body`)?.value||'').trim()}));if(p.some(x=>x.title.length<3||x.body.length<20))return toast(L('Preencha os títulos e textos nos três idiomas (mínimo 20 caracteres).','Complete titles and texts in all three languages (at least 20 characters).','请完整填写三种语言的标题和正文（正文至少 20 字符）。'));NX.editorial.unshift({id:uid('editor'),ptTitle:p[0].title,ptBody:p[0].body,enTitle:p[1].title,enBody:p[1].body,cnTitle:p[2].title,cnBody:p[2].body,status:'draft',at:Date.now(),author:a.name});networkSave();renderActive(true);toast(L('Rascunho guardado.','Draft saved.','草稿已保存。'))}
function editorialNext(id){const a=currentAccount();if(!a||!['editor','gestor'].includes(a.role))return;const e=NX.editorial.find(x=>x.id===id);if(!e)return;e.status=e.status==='draft'?'review':e.status==='review'?'published':'published';if(e.status==='published')syncEditorial();networkSave();renderActive(true);toast(e.status==='published'?L('Artigo publicado.','Article published.','文章已发布。'):L('Enviado para revisão.','Sent for review.','已提交审核。'))}
function renderOpsXmiddle(a){return `<div class="grid grid-2"><div class="panel"><div class="section-head"><h2>${L('Eventos autorizados','Authorised events','授权事件')}</h2><span class="pill">${NX.events.length}</span></div>${NX.events.length?NX.events.slice(0,18).map(e=>`<div class="data-line"><div><b>${esc(e.type.replaceAll('_',' '))}</b><small>${esc(e.station)} · ${esc(e.via)}</small></div><small>${new Date(e.time).toLocaleTimeString()}</small></div>`).join(''):`<div class="empty">${L('Sem eventos locais.','No local events.','暂无本地事件。')}</div>`}</div><div class="panel"><h2>${L('Integração eXange','eXange integration','eXange 集成')}</h2><div class="flow-rail" style="grid-template-columns:1fr 1fr"><div class="flow-block">Xstation</div><div class="flow-block">Xmiddle</div><div class="flow-block">YFISH Core</div><div class="flow-block">Bolsa YFISH</div></div><p class="muted" style="line-height:1.8;font-size:12px">${L('O SERVEX mantém a informação das Xmiddle em que está registado, recebe apenas eventos autorizados e solicita reservas à Xmiddle. O YFISH não utiliza a Xoperation-team do SAV.','The SERVEX tracks the Xmiddle platforms to which it is registered, receives only authorised events and requests reservations from Xmiddle. YFISH does not use SAV’s Xoperation-team.','SERVEX 管理注册的 Xmiddle 平台信息，只接收授权事件，并通过 Xmiddle 申请预约。YFISH 不使用 SAV 的 Xoperation-team。')}</p></div></div>`}
const navBeforeExt=renderNav;renderNav=function(){navBeforeExt();const a=currentAccount();const b=node('account-trigger');if(b){b.querySelector('.avatar').textContent=a?a.name.slice(0,1).toUpperCase():'◯';b.querySelector('.account-label').textContent=accountLabel();b.setAttribute('aria-label',a?L('Minha conta','My account','我的账号'):L('Entrar','Sign in','登录'))}const more=node('mobile-nav')?.querySelector('[data-action="mobile-more"]');if(more&&['xstations','operacoes','conta'].includes(S.nav)){more.classList.add('active')}const menu=node('side-nav');const selected=menu?.querySelector('.nav-item.active');if(selected)selected.scrollIntoView({block:'nearest',inline:'nearest'});};
const renderBeforeExt=renderActive;renderActive=function(rebuild=true){const newPages=['xstations','operacoes','conta'];if(!newPages.includes(S.nav)){renderBeforeExt(rebuild);return;}renderNav();document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===`page-${S.nav}`));const root=node(`page-${S.nav}`);if(root){root.innerHTML=S.nav==='xstations'?renderStations():S.nav==='operacoes'?renderOps():renderAccount();translateDOM(root);translateChrome();}node('cart-counter').textContent=S.cart.reduce((n,x)=>n+x.qty,0)};
const clickBeforeExt=handleClick;handleClick=function(event){const el=event.target.closest('[data-ext-action]');if(el){event.preventDefault();const act=el.dataset.extAction,id=el.dataset.id;if(act==='auth-login')return authModal('login');if(act==='auth-register')return authModal('register');if(act==='login-account'||act==='register-account')return void processAuth(act.replace('-account',''));if(act==='logout')return logoutAccount();if(act==='station-filter'){NX.stationFilter=id;renderActive(true);return}if(act==='station-details')return stationDetails(id);if(act==='station-choose')return stationPicker();if(act==='station-pick'){NX.selectedStation=id;stationPicker();return}if(act==='station-confirm')return checkoutModal();if(act==='place-order')return placeLocalOrder();if(act==='order-detail')return showOrder(id);if(act==='advance-order')return advanceOrder(id);if(act==='ops-tab'){NX.opsTab=id;renderActive(true);return}if(act==='create-catch')return createCatch();if(act==='editor-create')return editorialCreate();if(act==='editor-next')return editorialNext(id);return}return clickBeforeExt(event)};
const actionBeforeExt=handleAction;handleAction=function(button){if(button.dataset.action==='mobile-more')return showModal(`<div class="modal-head"><div class="eyebrow">YFISH</div><h2 id="dialog-title">${L('Explorar','Explore','探索')}</h2></div><div class="modal-body stack">${[...NAV.slice(3)].map(([id,label,ic])=>`<button class="btn outline full" data-nav="${id}" style="justify-content:flex-start;padding:14px">${icon(ic)} ${tr(label)} ${icon('arrow')}</button>`).join('')}</div>`);if(button.dataset.action==='membership'&&!loginGate('membership'))return;return actionBeforeExt(button)};
const navToBeforeExt=navTo;navTo=function(page,record=true){navToBeforeExt(page,record);};
const marketFeedBeforeExt=updateXmiddleFeed;updateXmiddleFeed=function(){marketFeedBeforeExt();const feed=node('xmiddle-feed-status');if(feed)feed.textContent=L(`${NX.events.length} eventos locais · sem ligação real`,`${NX.events.length} local events · no live connection`,`${NX.events.length} 本地事件 · 未连接真实系统`)};
// Restrict claims of source data: static station set is illustrative, not a live Xmiddle directory.
if(currentAccount())loadAccountSnapshot(currentAccount());
syncCatches();syncEditorial();
boot();

</script>
